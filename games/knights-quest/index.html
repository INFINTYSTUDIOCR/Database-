<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Knight's Quest — Infinity Studio</title>
<link rel="icon" href="assets/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@500;700;800&display=swap');
  :root{
    --gold:#E8C547; --gold2:#F5E6A3; --blood:#B91C1C; --ink:#07060C; --steel:#94A3B8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100%;height:100dvh;max-height:100dvh;margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    background:
      radial-gradient(ellipse at 50% 0%,#2a1a0a 0%,transparent 45%),
      radial-gradient(ellipse at 80% 80%,#1a0a12 0%,transparent 40%),
      #050508;
    font-family:Outfit,system-ui,sans-serif;overflow:auto;overscroll-behavior:contain;color:#fff;
    padding:0;touch-action:pan-y;
  }
  html{height:100%;height:100dvh}
  #stage{
    flex:1 1 auto;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:52px 8px 8px;box-sizing:border-box;
  }
  canvas{
    display:block;border-radius:12px;
    box-shadow:0 0 0 1px rgba(232,197,71,.35),0 0 0 3px rgba(0,0,0,.8),0 16px 40px rgba(0,0,0,.55);
    max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;cursor:crosshair;
  }
  #hud{
    position:fixed;top:0;left:0;right:0;width:100%;max-width:100vw;
    padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,5,8,.92),rgba(5,5,8,.55) 70%,transparent);
  }
  .pill{
    background:linear-gradient(180deg,rgba(20,14,8,.92),rgba(8,6,12,.88));
    border:1px solid rgba(232,197,71,.4);border-radius:999px;padding:5px 10px;
    font-size:11px;font-weight:800;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    white-space:nowrap;
  }
  #muteBtn,#fsBtn{appearance:none}
  .pill.gold{color:var(--gold)}
  .pill.blood{color:#fca5a5}
  #bars{display:flex;flex-direction:column;gap:3px;min-width:100px;flex:1 1 120px;max-width:200px}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .bar>i{display:block;height:100%;width:100%;border-radius:99px;transition:width .25s}
  #hpFill{background:linear-gradient(90deg,#7f1d1d,#ef4444,#fbbf24)}
  #feverFill{background:linear-gradient(90deg,#92400e,#E8C547,#fff7ed)}
  #hud-right{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center}
  #toast{
    position:fixed;top:48px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;
    pointer-events:none;z-index:8;font-family:Cinzel,serif;font-weight:900;font-size:clamp(16px,5vw,26px);
    letter-spacing:.06em;text-shadow:0 0 20px rgba(232,197,71,.8),0 4px 0 #000;transition:opacity .2s,transform .2s;
    max-width:92vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:520px){
    #hud{padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top))}
    .pill{font-size:10px;padding:4px 8px}
    #stage{padding-top:64px}
  }
  #load{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a1008,#050508 70%);z-index:30;gap:16px
  }
  #load.hide{opacity:0;pointer-events:none;transition:opacity .45s}
  #load img{width:96px;height:96px;filter:drop-shadow(0 0 24px rgba(232,197,71,.45))}
  #load-bar{width:min(280px,70vw);height:10px;background:#1c1410;border-radius:99px;overflow:hidden;border:1px solid rgba(232,197,71,.35)}
  #load-fill{height:100%;width:0;background:linear-gradient(90deg,#92400e,var(--gold),#fff7ed);transition:width .12s}
</style>
</head>
<body>
<div id="load">
  <img src="assets/icon.png" alt="" onerror="this.style.display='none'">
  <div style="font-family:Cinzel,serif;font-size:22px;letter-spacing:.12em;color:var(--gold)">KNIGHT'S QUEST</div>
  <div id="load-bar"><div id="load-fill"></div></div>
  <div id="load-txt" style="font-size:12px;opacity:.7">Forjando el arsenal teutónico…</div>
</div>
<div id="hud">
  <div class="pill"><span id="scoreVal">0</span> XP · BEST <span id="bestVal">0</span></div>
  <div id="bars">
    <div class="bar" title="HP"><i id="hpFill"></i></div>
    <div class="bar" title="Fever"><i id="feverFill" style="width:0%"></i></div>
  </div>
  <div id="hud-right">
    <button type="button" id="fsBtn" class="pill" style="pointer-events:auto;cursor:pointer;font:inherit;color:var(--gold)">PANTALLA</button>
    <button type="button" id="muteBtn" class="pill" style="pointer-events:auto;cursor:pointer;font:inherit;color:var(--gold)">SONIDO</button>
    <div class="pill gold">×<span id="multVal">1</span> · <span id="streakVal">0</span></div>
    <div class="pill blood">HP <span id="hpVal">3</span></div>
  </div>
</div>
<div id="toast"></div>
<div id="stage"><canvas id="c"></canvas></div>
<script>
(async function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const loadFill = document.getElementById('load-fill');
  const loadTxt = document.getElementById('load-txt');
  const toastEl = document.getElementById('toast');
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const stage = document.getElementById('stage');
    const padX = 16;
    const padY = 8;
    const hudH = Math.max(48, (document.getElementById('hud')?.offsetHeight || 48) + 8);
    const availW = Math.max(280, Math.min((stage?.clientWidth || window.innerWidth) - padX, window.innerWidth - padX));
    const availH = Math.max(180, Math.min((stage?.clientHeight || window.innerHeight) - padY, window.innerHeight - hudH - padY));
    let cssW = availW;
    let cssH = Math.round(cssW * 0.5625);
    if (cssH > availH) {
      cssH = availH;
      cssW = Math.round(cssH / 0.5625);
    }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  const W = () => canvas.clientWidth;
  const H = () => canvas.clientHeight;

  // ── LOAD ASSETS ──
  const manifest = await fetch('assets/manifest.json').then((r) => r.json());
  const FRAME = manifest.frame;
  const ANIMS = {};
  const imgs = {};
  const vfxImgs = {};

  let loaded = 0;
  const animKeys = Object.keys(manifest.anims);
  const vfxKeys = Object.keys(manifest.vfx || {});
  let total = animKeys.length;
  vfxKeys.forEach((k) => (total += manifest.vfx[k].frames || 0));

  function tickLoad(label) {
    loaded++;
    loadFill.style.width = Math.min(100, (loaded / total) * 100) + '%';
    if (label) loadTxt.textContent = label;
  }

  await Promise.all(
    animKeys.map(
      (key) =>
        new Promise((res, rej) => {
          const meta = manifest.anims[key];
          ANIMS[key] = { frames: meta.frames, fps: meta.fps || 12 };
          const img = new Image();
          img.onload = () => {
            imgs[key] = img;
            tickLoad(key);
            res();
          };
          img.onerror = () => {
            tickLoad('skip ' + key);
            res();
          };
          img.src = meta.file + '?v=full';
        })
    )
  );

  for (const key of vfxKeys) {
    const meta = manifest.vfx[key];
    vfxImgs[key] = [];
    for (let i = 0; i < meta.frames; i++) {
      await new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          vfxImgs[key].push(img);
          tickLoad(key);
          res();
        };
        img.onerror = () => {
          tickLoad(key);
          res();
        };
        img.src = meta.path + '/' + i + '.png?v=full';
      });
    }
  }

  const cardImg = new Image();
  cardImg.src = 'assets/card.png';

  // Prefetch SFX WAVs
  const SFX_NAMES = [
    'slash', 'hit', 'heavy', 'fireball', 'explode', 'ok', 'perfect', 'bad',
    'fever', 'boss', 'win', 'lose', 'tick', 'tickUrgent', 'hoof', 'click', 'start', 'ambient'
  ];
  const sfxRaw = {};
  loadTxt.textContent = 'Cargando sonidos de combate…';
  await Promise.all(
    SFX_NAMES.map(async (name) => {
      try {
        const res = await fetch('assets/sfx/' + name + '.wav?v=1');
        if (res.ok) sfxRaw[name] = await res.arrayBuffer();
      } catch (_) {}
      tickLoad(name);
    })
  );

  document.getElementById('load').classList.add('hide');
  setTimeout(() => document.getElementById('load')?.remove(), 500);

  // ── AUDIO ENGINE (WAV samples + fallback) ──
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  let master = null;
  let muted = localStorage.getItem('kq_mute') === '1';
  let ambientSrc = null;
  let ambientGain = null;
  let lastTickSec = -1;
  const sfxBuf = {};
  let sfxReady = false;

  async function ensureAudio() {
    if (!actx) {
      actx = new AudioCtx();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') await actx.resume();
    if (!sfxReady) {
      sfxReady = true;
      await Promise.all(
        Object.keys(sfxRaw).map(async (name) => {
          try {
            sfxBuf[name] = await actx.decodeAudioData(sfxRaw[name].slice(0));
          } catch (_) {}
        })
      );
    }
    return actx;
  }

  function setMuted(m) {
    muted = !!m;
    localStorage.setItem('kq_mute', muted ? '1' : '0');
    if (master) master.gain.value = muted ? 0 : 0.9;
    if (ambientGain) ambientGain.gain.value = muted ? 0 : 0.22;
    const b = document.getElementById('muteBtn');
    if (b) b.textContent = muted ? 'SONIDO OFF' : 'SONIDO ON';
  }

  function playBuf(name, opts) {
    const buf = sfxBuf[name];
    if (!buf || !actx || !master) return false;
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = !!(opts && opts.loop);
    const g = actx.createGain();
    g.gain.value = (opts && opts.gain != null ? opts.gain : 1) * (muted ? 0 : 1);
    src.connect(g);
    g.connect(master);
    src.start();
    if (opts && opts.loop) return { src, g };
    return true;
  }

  function startAmbient() {
    if (ambientSrc || muted) return;
    const looped = playBuf('ambient', { loop: true, gain: 0.22 });
    if (looped && looped.src) {
      ambientSrc = looped.src;
      ambientGain = looped.g;
    }
  }

  function sfx(kind) {
    ensureAudio().then(() => {
      startAmbient();
      if (muted && kind !== 'click') return;
      const map = {
        hit: 'hit',
        slash: 'slash',
        heavy: 'heavy',
        fireball: 'fireball',
        explode: 'explode',
        ok: 'ok',
        perfect: 'perfect',
        bad: 'bad',
        fever: 'fever',
        boss: 'boss',
        win: 'win',
        lose: 'lose',
        tick: 'tick',
        tickUrgent: 'tickUrgent',
        hoof: 'hoof',
        click: 'click',
        start: 'start'
      };
      const file = map[kind] || kind;
      const gains = {
        ambient: 0.22,
        slash: 0.85,
        hit: 0.9,
        heavy: 1,
        fireball: 0.85,
        explode: 1,
        perfect: 0.8,
        fever: 0.75,
        boss: 0.9,
        hoof: 0.55,
        tick: 0.4,
        tickUrgent: 0.55,
        click: 0.45
      };
      if (!playBuf(file, { gain: gains[file] != null ? gains[file] : 0.8 })) {
        // tiny fallback click if sample missing
        if (!actx) return;
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.frequency.value = 440;
        g.gain.value = muted ? 0 : 0.05;
        o.connect(g);
        g.connect(master);
        o.start();
        o.stop(actx.currentTime + 0.05);
      }
    });
  }

  document.getElementById('muteBtn')?.addEventListener('click', () => {
    ensureAudio().then(() => {
      setMuted(!muted);
      if (!muted) startAmbient();
      else if (ambientSrc) {
        try {
          ambientSrc.stop();
        } catch (_) {}
        ambientSrc = null;
        ambientGain = null;
      }
    });
  });
  setMuted(muted);

  function isDocFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFsBtn() {
    const b = document.getElementById('fsBtn');
    if (b) b.textContent = isDocFullscreen() ? 'SALIR FS' : 'PANTALLA';
  }
  async function toggleGameFullscreen() {
    try {
      if (isDocFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
      } else {
        const root = document.documentElement;
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) await req.call(root);
        else if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'knight-request-fullscreen' }, '*');
        }
      }
    } catch (_) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'knight-request-fullscreen' }, '*');
      }
    }
    setTimeout(syncFsBtn, 80);
  }
  document.getElementById('fsBtn')?.addEventListener('click', toggleGameFullscreen);
  document.addEventListener('fullscreenchange', syncFsBtn);
  document.addEventListener('webkitfullscreenchange', syncFsBtn);
  syncFsBtn();
  window.addEventListener('message', (ev) => {
    if (ev?.data?.type === 'knight-fs-changed') syncFsBtn();
  });

  // ── QUESTIONS (addictive variety) ──
  const QUESTIONS = [
    { prompt: 'El cliente llama molesto. ___ , quiero ayudarte.', correct: 'however', wrong: ['idk', 'like', 'um...'] },
    { prompt: 'Entiendo la situación. ___ , tomaré acción.', correct: 'therefore', wrong: ['and stuff', 'idk', 'you know'] },
    { prompt: 'Es difícil. ___ , podemos resolverlo.', correct: 'besides', wrong: ['like', 'um...', 'you know'] },
    { prompt: 'Llamé al supervisor. ___ , documenté todo.', correct: 'on top of that', wrong: ['idk', 'like', 'and stuff'] },
    { prompt: 'Es costoso ___ es muy efectivo.', correct: 'even though', wrong: ['like', 'idk', 'um...'] },
    { prompt: 'El sistema falló. ___ , escaloné de inmediato.', correct: 'as a result', wrong: ['you know', 'and stuff', 'um...'] },
    { prompt: 'El reporte está listo. ___ , lo envié.', correct: 'furthermore', wrong: ['like', 'idk', 'you know'] },
    { prompt: 'Primero escuché. ___ , confirmé el ticket.', correct: 'then', wrong: ['idk', 'and stuff', 'like'] },
    { prompt: 'No fue fácil. ___ , cerramos el caso.', correct: 'nevertheless', wrong: ['um...', 'you know', 'idk'] },
    { prompt: 'Revisé los logs. ___ , encontré la causa.', correct: 'eventually', wrong: ['kinda', 'idk', 'whatever'] },
    { prompt: 'El cliente insiste. ___ , mantengo la calma.', correct: 'still', wrong: ['lol', 'idk', 'bruh'] },
    { prompt: 'Ya validé el pago. ___ , actualicé el CRM.', correct: 'afterward', wrong: ['and stuff', 'like', 'idk'] }
  ];

  const ENEMY_TYPES = [
    { name: 'Slime of Confusion', kind: 'slime', color: '#22c55e', hp: 2, wrongWord: 'idk', xp: 100 },
    { name: 'Ghost of Hesitation', kind: 'ghost', color: '#a78bfa', hp: 2, wrongWord: 'um...', xp: 120 },
    { name: 'Bone of Slang', kind: 'skel', color: '#e2e8f0', hp: 3, wrongWord: 'and stuff', xp: 140 },
    { name: 'Warlock of Muletillas', kind: 'warlock', color: '#fb923c', hp: 3, wrongWord: 'you know', xp: 160 },
    { name: 'Wyrm of Doubt', kind: 'dragon', color: '#f87171', hp: 4, wrongWord: 'like', xp: 200 },
    { name: 'BOSS: Babel Knight', kind: 'boss', color: '#E8C547', hp: 6, wrongWord: 'whatever', xp: 400, boss: true }
  ];

  // ── STATE ──
  const STATES = { MENU: 'menu', PLAY: 'play', RESULTS: 'results' };
  let gameState = STATES.MENU;
  let enemy = null;
  let currentQ = null;
  let options = [];
  let frameCount = 0;
  let bgScroll = 0;
  let roundCount = 0;
  let questionsAnswered = 0;
  let floatingTexts = [];
  let fxList = [];
  let particles = [];
  let shake = 0;
  let hitstop = 0;
  let flash = 0;
  let mouseX = 0,
    mouseY = 0;
  let qBorn = 0;
  let timerMax = 8;
  let fever = 0;
  let mounted = false;
  let best = +localStorage.getItem('kq_best') || 0;
  document.getElementById('bestVal').textContent = best;

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), ms || 900);
  }

  function mult() {
    return Math.min(8, 1 + Math.floor(knight.streak / 2));
  }
  function feverMax() {
    return 100;
  }

  // ── HELPERS ──
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function spawnFx(kind, x, y, scale, rot) {
    if (!vfxImgs[kind]?.length) return;
    fxList.push({ kind, x, y, scale: scale || 1, rot: rot || 0, frame: 0, tick: 0 });
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < (n || 14); i++) {
      particles.push({
        x,
        y,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 6 - 1,
        life: 1,
        r: 2 + Math.random() * 4,
        color
      });
    }
  }
  function addText(x, y, text, color, size) {
    floatingTexts.push({ x, y, text, color, life: 1, vy: -1.8, size: size || 1 });
  }

  // ── KNIGHT ──
  const knight = {
    x: 0,
    y: 0,
    anim: 'idle',
    frame: 0,
    tick: 0,
    hp: 3,
    maxHp: 3,
    score: 0,
    streak: 0,
    state: 'idle',
    invincible: 0,
    lunge: 0,
    draw() {
      let key = this.anim;
      if (mounted && (key === 'idle' || key === 'idle_b')) key = 'horse_idle';
      const a = ANIMS[key];
      const img = imgs[key];
      if (!a || !img?.complete) return;
      const f = Math.floor(this.frame) % a.frames;
      const scale = (H() * (mounted ? 0.62 : 0.56)) / FRAME.h;
      const dw = FRAME.w * scale;
      const dh = FRAME.h * scale;
      const ox = this.lunge;
      ctx.save();
      // ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(this.x + ox, this.y + 4, dw * 0.28, dh * 0.04, 0, 0, Math.PI * 2);
      ctx.fill();
      if (this.invincible > 0 && Math.floor(this.invincible / 3) % 2 === 0) ctx.globalAlpha = 0.35;
      if (fever > 70) {
        ctx.shadowColor = '#E8C547';
        ctx.shadowBlur = 18;
      }
      ctx.drawImage(img, f * FRAME.w, 0, FRAME.w, FRAME.h, this.x + ox - dw / 2, this.y - dh, dw, dh);
      ctx.restore();
    },
    update() {
      if (this.lunge > 0) this.lunge *= 0.82;
      const key =
        mounted && (this.anim === 'idle' || this.anim === 'idle_b') ? 'horse_idle' : this.anim;
      const a = ANIMS[key];
      if (!a) return;
      this.tick++;
      if (this.tick >= 60 / a.fps) {
        this.tick = 0;
        this.frame++;
        const done = this.frame >= a.frames;
        if (done) {
          if (['attack', 'attack_b', 'attack_c', 'attack_d', 'attack_e', 'kick', 'air_a', 'air_b', 'fireball', 'run_attack', 'horse_atk', 'horse_atk_b', 'arrow', 'throw', 'dash', 'dash_back', 'roll', 'slide', 'jump', 'duck', 'suspicious', 'shield', 'block'].includes(this.state)) {
            this.state = 'idle';
            this.setAnim(mounted ? 'horse_idle' : Math.random() > 0.5 ? 'idle' : 'idle_b');
          } else if (this.state === 'hurt') {
            this.state = 'idle';
            this.setAnim(fever < 30 && Math.random() > 0.6 ? 'hurt_idle' : 'idle');
          } else if (this.state === 'die') {
            this.frame = a.frames - 1;
          } else if (this.state === 'win' || this.state === 'greet' || this.state === 'guard') {
            if (this.state === 'greet' || this.state === 'guard') {
              this.state = 'idle';
              this.setAnim('idle');
            } else this.frame = 0;
          } else if (this.state === 'block') {
            this.state = 'idle';
            this.setAnim('idle');
          } else this.frame = 0;
        }
      }
      if (this.invincible > 0) this.invincible--;
    },
    setAnim(name) {
      if (!ANIMS[name] || !imgs[name]) name = 'idle';
      if (this.anim === name) return;
      this.anim = name;
      this.frame = 0;
      this.tick = 0;
    },
    pickAttack() {
      if (mounted) return Math.random() > 0.5 ? 'horse_atk' : 'horse_atk_b';
      if (fever >= 85) return ['fireball', 'attack_e', 'arrow', 'throw'][(Math.random() * 4) | 0];
      if (knight.streak >= 6) return ['attack_c', 'attack_d', 'air_a', 'air_b', 'kick', 'run_attack', 'slide'][(Math.random() * 7) | 0];
      if (knight.streak >= 3) return ['attack_b', 'attack_c', 'kick', 'dash', 'roll', 'jump'][(Math.random() * 6) | 0];
      return Math.random() > 0.5 ? 'attack' : 'attack_b';
    },
    doAttack(perfect) {
      if (this.state === 'die') return;
      const atk = this.pickAttack();
      this.state = atk;
      this.setAnim(atk);
      this.lunge = W() * 0.08;
      const ex = this.x + W() * 0.18;
      const ey = this.y - H() * 0.28;
      if (atk === 'fireball') {
        spawnFx('fireball', ex, ey, 1.1);
        sfx('fireball');
      } else if (atk.includes('horse')) {
        spawnFx('slam', ex + 20, this.y - 10, 1.2);
        sfx('heavy');
        sfx('hoof');
      } else if (atk === 'kick' || atk === 'dash') {
        spawnFx('smoke', this.x, this.y - 20, 0.9);
        sfx('heavy');
      } else {
        spawnFx('slash', ex, ey, perfect ? 1.25 : 1);
        sfx('slash');
      }
      if (perfect) spawnFx('spin', ex, ey - 20, 0.7);
    },
    doHurt() {
      if (this.state === 'die') return;
      this.hp--;
      this.invincible = 70;
      this.streak = 0;
      fever = Math.max(0, fever - 25);
      mounted = false;
      this.state = 'hurt';
      this.setAnim(Math.random() > 0.55 ? 'hurt' : 'dash_back');
      if (this.anim === 'dash_back') this.state = 'dash_back';
      shake = 16;
      flash = 10;
      spawnFx('smoke', this.x, this.y - H() * 0.2, 0.8);
      updateHUD();
      if (this.hp <= 0) {
        this.state = 'die';
        this.setAnim(Math.random() > 0.5 ? 'die' : 'die_b');
        setTimeout(() => setState(STATES.RESULTS), 2400);
      }
    },
    doWin() {
      this.state = 'win';
      this.setAnim('dance');
      mounted = false;
    }
  };

  // ── ENEMY ──
  class Enemy {
    constructor(type) {
      this.type = type;
      this.x = W() * 0.74;
      this.y = H() * 0.38;
      this.w = H() * (type.boss ? 0.22 : 0.17);
      this.h = H() * (type.boss ? 0.28 : 0.22);
      this.hp = type.hp;
      this.maxHp = type.hp;
      this.shaking = 0;
      this.dead = false;
      this.alpha = 1;
      this.particles = [];
    }
    draw() {
      if (this.dead && this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = this.alpha;
      const sk = this.shaking > 0 ? Math.sin(this.shaking * 0.9) * 7 : 0;
      const x = this.x + sk;
      const y = this.y + Math.sin(frameCount * 0.05) * 5;
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + this.h * 0.42, this.w * 0.42, this.h * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();

      const k = this.type.kind;
      if (k === 'ghost') this.drawGhost(x, y);
      else if (k === 'skel') this.drawSkel(x, y);
      else if (k === 'warlock') this.drawWarlock(x, y);
      else if (k === 'dragon') this.drawDragon(x, y);
      else if (k === 'boss') this.drawBoss(x, y);
      else this.drawSlime(x, y);

      // label
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      roundRect(ctx, x - this.w * 0.75, y - this.h * 0.72, this.w * 1.5, this.h * 0.18, 6);
      ctx.fill();
      ctx.strokeStyle = this.type.color;
      ctx.lineWidth = 1.5;
      roundRect(ctx, x - this.w * 0.75, y - this.h * 0.72, this.w * 1.5, this.h * 0.18, 6);
      ctx.stroke();
      ctx.fillStyle = '#fecaca';
      ctx.font = `bold ${H() * 0.026}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.type.wrongWord, x, y - this.h * 0.63);

      const bw = this.w * 1.3,
        bh = 7;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(ctx, x - bw / 2, y - this.h * 0.82, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = this.type.boss ? '#E8C547' : '#ef4444';
      roundRect(ctx, x - bw / 2, y - this.h * 0.82, bw * (this.hp / this.maxHp), bh, 3);
      ctx.fill();

      this.particles.forEach((p) => {
        ctx.globalAlpha = p.life * this.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }
    drawSlime(x, y) {
      const g = ctx.createRadialGradient(x - 8, y - 10, 4, x, y, this.w * 0.55);
      g.addColorStop(0, '#86efac');
      g.addColorStop(1, '#15803d');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, this.w * 0.45, this.h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      this.face(x, y);
    }
    drawGhost(x, y) {
      ctx.fillStyle = 'rgba(167,139,250,0.85)';
      ctx.beginPath();
      ctx.moveTo(x - this.w * 0.35, y + this.h * 0.35);
      ctx.quadraticCurveTo(x - this.w * 0.4, y - this.h * 0.35, x, y - this.h * 0.4);
      ctx.quadraticCurveTo(x + this.w * 0.4, y - this.h * 0.35, x + this.w * 0.35, y + this.h * 0.35);
      for (let i = 0; i < 4; i++) {
        const px = x + this.w * 0.35 - (i * this.w * 0.7) / 3;
        ctx.quadraticCurveTo(px - this.w * 0.08, y + this.h * 0.48, px - this.w * 0.17, y + this.h * 0.35);
      }
      ctx.fill();
      this.face(x, y - this.h * 0.05, true);
    }
    drawSkel(x, y) {
      ctx.strokeStyle = '#f1f5f9';
      ctx.fillStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - this.h * 0.15, this.w * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(x - 8, y - this.h * 0.18, 5, 7, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 8, y - this.h * 0.18, 5, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(x, y + this.h * 0.05);
      ctx.lineTo(x, y + this.h * 0.35);
      ctx.moveTo(x, y + this.h * 0.15);
      ctx.lineTo(x - 16, y + this.h * 0.28);
      ctx.moveTo(x, y + this.h * 0.15);
      ctx.lineTo(x + 16, y + this.h * 0.28);
      ctx.stroke();
    }
    drawWarlock(x, y) {
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.moveTo(x, y - this.h * 0.5);
      ctx.lineTo(x + this.w * 0.35, y - this.h * 0.1);
      ctx.lineTo(x - this.w * 0.35, y - this.h * 0.1);
      ctx.fill();
      const g = ctx.createRadialGradient(x, y, 2, x, y, this.w * 0.4);
      g.addColorStop(0, '#fdba74');
      g.addColorStop(1, '#9a3412');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y + this.h * 0.05, this.w * 0.32, this.h * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      this.face(x, y);
      ctx.fillStyle = '#E8C547';
      ctx.beginPath();
      ctx.arc(x + this.w * 0.35, y + 10, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    drawDragon(x, y) {
      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.ellipse(x, y, this.w * 0.48, this.h * 0.32, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + this.w * 0.35, y - 10);
      ctx.lineTo(x + this.w * 0.7, y);
      ctx.lineTo(x + this.w * 0.35, y + 12);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(x + this.w * 0.15, y - 6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(x - 10, y - this.h * 0.25);
      ctx.lineTo(x, y - this.h * 0.45);
      ctx.lineTo(x + 10, y - this.h * 0.25);
      ctx.fill();
    }
    drawBoss(x, y) {
      ctx.save();
      ctx.shadowColor = '#E8C547';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath();
      ctx.ellipse(x, y, this.w * 0.42, this.h * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#E8C547';
      ctx.lineWidth = 3;
      ctx.stroke();
      // horns
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(x - 20, y - this.h * 0.2);
      ctx.lineTo(x - 34, y - this.h * 0.5);
      ctx.lineTo(x - 8, y - this.h * 0.28);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 20, y - this.h * 0.2);
      ctx.lineTo(x + 34, y - this.h * 0.5);
      ctx.lineTo(x + 8, y - this.h * 0.28);
      ctx.fill();
      this.face(x, y);
      ctx.fillStyle = '#E8C547';
      ctx.font = `900 ${H() * 0.03}px Cinzel,serif`;
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', x, y + this.h * 0.48);
    }
    face(x, y, soft) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(x - 10, y - 6, 7, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 10, y - 6, 7, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(x - 9, y - 5, 3, 0, Math.PI * 2);
      ctx.arc(x + 11, y - 5, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 16);
      ctx.lineTo(x - 4, y - 12);
      ctx.moveTo(x + 4, y - 12);
      ctx.lineTo(x + 16, y - 16);
      ctx.stroke();
      if (!soft) {
        ctx.beginPath();
        ctx.arc(x, y + 10, 10, 0.15, Math.PI - 0.15);
        ctx.stroke();
      }
    }
    update() {
      if (this.shaking > 0) this.shaking--;
      if (this.dead) this.alpha -= 0.03;
      this.particles = this.particles.filter((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.035;
        return p.life > 0;
      });
    }
    hit(dmg) {
      this.hp -= dmg;
      this.shaking = 16;
      for (let i = 0; i < 16; i++) {
        this.particles.push({
          x: this.x,
          y: this.y,
          vx: (Math.random() - 0.5) * 7,
          vy: -Math.random() * 5,
          color: this.type.color,
          r: 3 + Math.random() * 4,
          life: 1
        });
      }
      if (this.hp <= 0) {
        this.dead = true;
        spawnFx('explosion', this.x, this.y, this.type.boss ? 1.5 : 1.1);
        spawnFx('slam', this.x, this.y + 20, 1);
        burst(this.x, this.y, this.type.color, 24);
        return true;
      }
      return false;
    }
  }

  // ── BACKGROUND HIGH-END ──
  function drawBG() {
    const w = W(),
      h = H(),
      t = frameCount;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#05040a');
    sky.addColorStop(0.35, '#1a0f18');
    sky.addColorStop(0.65, '#2a1830');
    sky.addColorStop(1, '#1a2a1a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // moon + rays
    const mx = w * 0.82,
      my = h * 0.14,
      mr = h * 0.075;
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 4);
    glow.addColorStop(0, 'rgba(253,230,138,0.35)');
    glow.addColorStop(0.4, 'rgba(232,197,71,0.1)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mx, my, mr * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff7ed';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0f18';
    ctx.beginPath();
    ctx.arc(mx + mr * 0.35, my - mr * 0.12, mr * 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = '#F5E6A3';
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, h * 0.7, -0.9 + i * 0.12, -0.82 + i * 0.12);
      ctx.fill();
    }
    ctx.restore();

    // stars
    for (let i = 0; i < 70; i++) {
      const sx = ((i * 97) % 100) / 100,
        sy = ((i * 53) % 50) / 100;
      const tw = 0.3 + 0.7 * ((Math.sin(t * 0.05 + i) + 1) / 2);
      ctx.globalAlpha = 0.2 + tw * 0.8;
      ctx.fillStyle = i % 6 === 0 ? '#E8C547' : '#fff';
      ctx.fillRect(w * sx, h * sy * 0.5, tw > 0.8 ? 2 : 1, tw > 0.8 ? 2 : 1);
    }
    ctx.globalAlpha = 1;

    const scroll = (bgScroll * 0.2) % w;
    // far ruins
    ctx.fillStyle = '#120c18';
    for (let i = 0; i < 8; i++) {
      const bx = ((i * 140 - scroll * 0.3) % (w + 160)) - 40;
      const bh = 40 + ((i * 37) % 80);
      ctx.fillRect(bx, h * 0.55 - bh, 28 + (i % 3) * 10, bh);
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(232,197,71,0.25)';
        ctx.fillRect(bx + 8, h * 0.55 - bh + 16, 6, 8);
        ctx.fillStyle = '#120c18';
      }
    }

    drawCastle(w * 0.58, h * 0.28, w * 0.4, h * 0.54, 0.7);
    drawCemetery(w * 0.01, h * 0.52, w * 0.38, h * 0.3, t);
    drawCastle(w * 0.02, h * 0.4, w * 0.24, h * 0.42, 0.95);

    // fog
    const fog = ctx.createLinearGradient(0, h * 0.5, 0, h * 0.82);
    fog.addColorStop(0, 'rgba(148,163,184,0)');
    fog.addColorStop(0.5, 'rgba(148,163,184,0.1)');
    fog.addColorStop(1, 'rgba(15,10,20,0.35)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, h * 0.5, w, h * 0.35);

    // ground
    const ground = ctx.createLinearGradient(0, h * 0.78, 0, h);
    ground.addColorStop(0, '#14532d');
    ground.addColorStop(0.4, '#166534');
    ground.addColorStop(1, '#052e16');
    ctx.fillStyle = ground;
    ctx.fillRect(0, h * 0.82, w, h * 0.18);

    // arena stone
    const fy = h * 0.775,
      fh = h * 0.07;
    const stone = ctx.createLinearGradient(0, fy, 0, fy + fh);
    stone.addColorStop(0, '#9ca3af');
    stone.addColorStop(0.4, '#6b7280');
    stone.addColorStop(1, '#374151');
    ctx.fillStyle = stone;
    roundRect(ctx, w * 0.05, fy, w * 0.9, fh, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,197,71,0.25)';
    ctx.lineWidth = 2;
    roundRect(ctx, w * 0.05, fy, w * 0.9, fh, 8);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    for (let i = 1; i < 10; i++) {
      const sx = w * 0.05 + i * ((w * 0.9) / 10);
      ctx.beginPath();
      ctx.moveTo(sx, fy + 3);
      ctx.lineTo(sx, fy + fh - 3);
      ctx.stroke();
    }

    // torches
    drawTorch(w * 0.09, fy, t);
    drawTorch(w * 0.91, fy, t);

    // ember particles ambient
    ctx.fillStyle = 'rgba(251,146,60,0.7)';
    for (let i = 0; i < 18; i++) {
      const ex = ((i * 89 + t * (0.4 + (i % 3) * 0.2)) % w);
      const ey = h * 0.35 + ((i * 47 + t) % (h * 0.45));
      ctx.globalAlpha = 0.25 + 0.5 * Math.sin(t * 0.1 + i);
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (fever > 60) {
      const feverGlow = ctx.createRadialGradient(w * 0.25, h * 0.7, 0, w * 0.25, h * 0.7, w * 0.4);
      feverGlow.addColorStop(0, 'rgba(232,197,71,0.12)');
      feverGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = feverGlow;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawCastle(x, y, cw, ch, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#1f1830';
    ctx.fillRect(x + cw * 0.28, y + ch * 0.2, cw * 0.44, ch * 0.8);
    ctx.fillStyle = '#151022';
    ctx.fillRect(x, y + ch * 0.32, cw * 0.22, ch * 0.68);
    ctx.fillRect(x + cw * 0.78, y + ch * 0.28, cw * 0.22, ch * 0.72);
    ctx.fillStyle = '#2a2244';
    for (let i = 0; i < 9; i++) if (i % 2 === 0) ctx.fillRect(x + cw * 0.28 + i * cw * 0.05, y + ch * 0.12, cw * 0.04, ch * 0.1);
    ctx.fillStyle = '#07050c';
    ctx.beginPath();
    ctx.moveTo(x + cw * 0.4, y + ch);
    ctx.lineTo(x + cw * 0.4, y + ch * 0.6);
    ctx.quadraticCurveTo(x + cw * 0.5, y + ch * 0.45, x + cw * 0.6, y + ch * 0.6);
    ctx.lineTo(x + cw * 0.6, y + ch);
    ctx.fill();
    [
      [0.36, 0.35],
      [0.52, 0.35],
      [0.44, 0.5],
      [0.08, 0.45],
      [0.86, 0.42]
    ].forEach(([wx, wy], i) => {
      ctx.fillStyle = `rgba(232,197,71,${0.35 + 0.45 * Math.sin(frameCount * 0.12 + i)})`;
      ctx.fillRect(x + cw * wx, y + ch * wy, cw * 0.055, ch * 0.07);
    });
    ctx.fillStyle = '#B91C1C';
    ctx.fillRect(x + cw * 0.48, y + ch * 0.22, cw * 0.035, ch * 0.2);
    const wave = Math.sin(frameCount * 0.08) * cw * 0.02;
    ctx.beginPath();
    ctx.moveTo(x + cw * 0.515, y + ch * 0.22);
    ctx.lineTo(x + cw * 0.7 + wave, y + ch * 0.28);
    ctx.lineTo(x + cw * 0.515, y + ch * 0.34);
    ctx.fill();
    ctx.restore();
  }

  function drawCemetery(x, y, cw, ch, t) {
    ctx.save();
    // fence
    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const fx = x + (cw * i) / 11;
      ctx.beginPath();
      ctx.moveTo(fx, y + ch * 0.7);
      ctx.lineTo(fx, y + ch * 0.95);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(fx, y + ch * 0.7);
      ctx.lineTo(fx + 3, y + ch * 0.62);
      ctx.lineTo(fx + 6, y + ch * 0.7);
      ctx.stroke();
    }
    [
      [0.2, 0.35],
      [0.4, 0.4],
      [0.58, 0.32],
      [0.75, 0.45]
    ].forEach(([gx, gy], i) => {
      const sx = x + cw * gx,
        sy = y + ch * gy,
        gw = cw * 0.1,
        gh = ch * 0.4;
      ctx.fillStyle = i % 2 ? '#52525b' : '#3f3f46';
      ctx.beginPath();
      ctx.moveTo(sx, sy + gh);
      ctx.lineTo(sx, sy + gh * 0.32);
      ctx.quadraticCurveTo(sx + gw / 2, sy, sx + gw, sy + gh * 0.32);
      ctx.lineTo(sx + gw, sy + gh);
      ctx.fill();
      ctx.fillStyle = '#a1a1aa';
      ctx.fillRect(sx + gw * 0.4, sy + gh * 0.25, gw * 0.2, gh * 0.3);
      ctx.fillRect(sx + gw * 0.2, sy + gh * 0.34, gw * 0.6, gh * 0.1);
    });
    for (let i = 0; i < 6; i++) {
      const wx = x + cw * (0.15 + i * 0.14) + Math.sin(t * 0.04 + i) * 10;
      const wy = y + ch * 0.25 + Math.cos(t * 0.05 + i) * 12;
      ctx.fillStyle = `rgba(196,181,253,${0.12 + 0.18 * Math.sin(t * 0.06 + i)})`;
      ctx.beginPath();
      ctx.ellipse(wx, wy, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTorch(x, y, t) {
    ctx.fillStyle = '#44403c';
    ctx.fillRect(x - 3, y - 22, 6, 22);
    const fl = 0.7 + 0.3 * Math.sin(t * 0.4 + x);
    const g = ctx.createRadialGradient(x, y - 28, 1, x, y - 28, 20 * fl);
    g.addColorStop(0, '#fff7ed');
    g.addColorStop(0.35, '#fb923c');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - 28, 20 * fl, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── GAME FLOW ──
  function loadQuestion() {
    currentQ = QUESTIONS[questionsAnswered % QUESTIONS.length];
    const wrong = currentQ.wrong.slice().sort(() => Math.random() - 0.5).slice(0, 2);
    options = [{ word: currentQ.correct, isCorrect: true }, ...wrong.map((w) => ({ word: w, isCorrect: false }))];
    options.sort(() => Math.random() - 0.5);
    qBorn = performance.now();
    timerMax = Math.max(4.5, 8 - knight.streak * 0.25 - (enemy?.type.boss ? 1 : 0));
  }

  function drawTimer() {
    if (!currentQ || gameState !== STATES.PLAY) return;
    const left = Math.max(0, timerMax - (performance.now() - qBorn) / 1000);
    const pct = left / timerMax;
    const secLeft = Math.ceil(left);
    if (secLeft !== lastTickSec && left > 0 && left <= 3.2) {
      lastTickSec = secLeft;
      sfx(left <= 1.6 ? 'tickUrgent' : 'tick');
    }
    if (left > 3.2) lastTickSec = -1;
    const x = W() * 0.15,
      y = H() * 0.08,
      bw = W() * 0.7,
      bh = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, x, y, bw, bh, 4);
    ctx.fill();
    ctx.fillStyle = pct > 0.4 ? '#E8C547' : pct > 0.2 ? '#fb923c' : '#ef4444';
    roundRect(ctx, x, y, bw * pct, bh, 4);
    ctx.fill();
    if (left <= 0 && options.length) {
      options = [];
      knight.doHurt();
      sfx('bad');
      addText(W() / 2, H() * 0.4, '¡TIEMPO!', '#ef4444', 1.3);
      setTimeout(() => {
        if (knight.state !== 'die') loadQuestion();
      }, 800);
    }
  }

  function drawQuestion() {
    if (!currentQ) return;
    const by = H() * 0.875,
      bh = H() * 0.125;
    ctx.fillStyle = 'rgba(8,6,12,0.88)';
    ctx.fillRect(0, by, W(), bh);
    ctx.strokeStyle = 'rgba(232,197,71,0.4)';
    ctx.beginPath();
    ctx.moveTo(0, by);
    ctx.lineTo(W(), by);
    ctx.stroke();
    ctx.fillStyle = '#E8C547';
    ctx.font = `bold ${H() * 0.024}px Cinzel,serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('COMPLETÁ LA CADENA', W() * 0.03, by + bh * 0.28);
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${H() * 0.03}px Outfit,sans-serif`;
    ctx.fillText(currentQ.prompt, W() * 0.03, by + bh * 0.68);
  }

  function drawOptions() {
    if (!options.length) return;
    const btnW = W() * 0.27,
      btnH = H() * 0.08;
    const startX = (W() - options.length * btnW - (options.length - 1) * 12) / 2;
    const btnY = H() * 0.6;
    options.forEach((opt, i) => {
      const x = startX + i * (btnW + 12);
      const hover = mouseX > x && mouseX < x + btnW && mouseY > btnY && mouseY < btnY + btnH;
      const g = ctx.createLinearGradient(x, btnY, x, btnY + btnH);
      if (hover) {
        g.addColorStop(0, 'rgba(232,197,71,0.35)');
        g.addColorStop(1, 'rgba(120,53,15,0.7)');
      } else {
        g.addColorStop(0, 'rgba(30,20,12,0.85)');
        g.addColorStop(1, 'rgba(10,8,14,0.9)');
      }
      ctx.fillStyle = g;
      roundRect(ctx, x, btnY, btnW, btnH, 10);
      ctx.fill();
      ctx.strokeStyle = hover ? '#E8C547' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = hover ? 2 : 1;
      roundRect(ctx, x, btnY, btnW, btnH, 10);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `800 ${H() * 0.034}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(opt.word, x + btnW / 2, btnY + btnH / 2);
      opt.rect = { x, y: btnY, w: btnW, h: btnH };
    });
  }

  function answer(opt) {
    if (gameState !== STATES.PLAY || knight.state === 'die' || !options.length) return;
    const elapsed = (performance.now() - qBorn) / 1000;
    const perfect = elapsed <= 2.2;
    const fast = elapsed <= 4;
    options = [];
    if (opt.isCorrect) {
      const m = mult();
      let gain = (enemy.type.xp || 100) + knight.streak * 15;
      if (perfect) gain = Math.round(gain * 1.75);
      else if (fast) gain = Math.round(gain * 1.25);
      gain *= m;
      knight.score += gain;
      knight.streak++;
      fever = Math.min(feverMax(), fever + (perfect ? 22 : 14));
      if (fever >= 100 && !mounted) {
        mounted = true;
        toast('¡FEVER MOUNT!', 1200);
        sfx('fever');
        spawnFx('smoke_up', knight.x, knight.y - 30, 1.2);
        knight.setAnim('horse_idle');
      }
      knight.doAttack(perfect);
      hitstop = perfect ? 8 : 4;
      shake = perfect ? 12 : 7;
      const killed = enemy.hit(perfect ? 2 : 1);
      sfx(perfect ? 'perfect' : 'ok');
      sfx('hit');
      if (killed) sfx('explode');
      addText(enemy.x, enemy.y - H() * 0.18, '+' + gain, '#E8C547', perfect ? 1.35 : 1);
      addText(knight.x, knight.y - H() * 0.3, perfect ? 'PERFECT!' : fast ? 'GREAT!' : opt.word.toUpperCase() + '!', perfect ? '#F5E6A3' : '#86efac', 1.1);
      if (knight.streak >= 3) toast(knight.streak + ' STREAK ×' + m, 700);
      updateHUD();
      questionsAnswered++;
      if (killed) {
        toast(enemy.type.boss ? 'BOSS DOWN' : 'ENEMY DOWN', 900);
        setTimeout(() => nextEnemy(), 1100);
      } else setTimeout(() => loadQuestion(), 450);
    } else {
      knight.doHurt();
      if (Math.random() > 0.5 && knight.state !== 'die') {
        setTimeout(() => {
          if (knight.state === 'idle') {
            knight.state = 'suspicious';
            knight.setAnim('suspicious');
          }
        }, 400);
      }
      enemy.shaking = 18;
      sfx('bad');
      addText(knight.x, knight.y - H() * 0.28, 'FAIL', '#ef4444', 1.2);
      addText(W() / 2, H() * 0.42, '"' + opt.word + '" no conecta', '#fca5a5');
      updateHUD();
      setTimeout(() => {
        if (knight.state !== 'die') loadQuestion();
      }, 900);
    }
  }

  function nextEnemy() {
    if (roundCount >= 10) {
      knight.doWin();
      setState(STATES.RESULTS);
      return;
    }
    roundCount++;
    let type;
    if (roundCount === 5 || roundCount === 10) type = ENEMY_TYPES[5];
    else {
      const idx = Math.min(Math.floor((roundCount - 1) / 2), 4);
      type = ENEMY_TYPES[idx];
    }
    enemy = new Enemy(type);
    if (type.boss) {
      toast('⚠ BOSS ROUND', 1200);
      sfx('boss');
    }
    loadQuestion();
  }

  function updateHUD() {
    document.getElementById('scoreVal').textContent = knight.score;
    document.getElementById('streakVal').textContent = knight.streak;
    document.getElementById('multVal').textContent = mult();
    document.getElementById('hpVal').textContent = knight.hp;
    document.getElementById('hpFill').style.width = (knight.hp / knight.maxHp) * 100 + '%';
    document.getElementById('feverFill').style.width = fever + '%';
    document.getElementById('bestVal').textContent = Math.max(best, knight.score);
  }

  function setState(s) {
    gameState = s;
    if (s === STATES.PLAY) {
      knight.hp = 3;
      knight.score = 0;
      knight.streak = 0;
      knight.state = 'idle';
      knight.setAnim('idle');
      roundCount = 0;
      questionsAnswered = 0;
      fever = 0;
      mounted = false;
      floatingTexts = [];
      fxList = [];
      particles = [];
      nextEnemy();
      updateHUD();
    }
    if (s === STATES.RESULTS) {
      if (knight.score > best) {
        best = knight.score;
        localStorage.setItem('kq_best', best);
        toast('NEW BEST!', 1400);
      }
      sfx(knight.hp > 0 ? 'win' : 'lose');
      updateHUD();
    }
    if (s === STATES.PLAY) sfx('start');
  }

  // ── SCREENS ──
  function drawMenu() {
    drawBG();
    knight.x = W() * 0.2;
    knight.y = H() * 0.82;
    if (frameCount % 320 === 2) {
      knight.state = 'greet';
      knight.setAnim('greet');
    }
    if (frameCount % 500 === 100) {
      knight.state = 'guard';
      knight.setAnim('guard');
    }
    knight.update();
    knight.draw();

    if (cardImg.complete && cardImg.naturalWidth) {
      const cw = H() * 0.32;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(cardImg, W() * 0.72 - cw / 2, H() * 0.22, cw, cw * 1.4);
      ctx.globalAlpha = 1;
    }

    const pw = W() * 0.52,
      ph = H() * 0.68;
    const px = (W() - pw) / 2,
      py = (H() - ph) / 2;
    ctx.fillStyle = 'rgba(8,5,10,0.82)';
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,197,71,0.65)';
    ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.075}px Cinzel,serif`;
    ctx.fillText("KNIGHT'S", W() / 2, py + ph * 0.16);
    ctx.fillStyle = '#E8C547';
    ctx.fillText('QUEST', W() / 2, py + ph * 0.3);
    ctx.fillStyle = '#c4b5fd';
    ctx.font = `600 ${H() * 0.024}px Outfit,sans-serif`;
    ctx.fillText('Full Teutonic Arsenal · Infinity Studio', W() / 2, py + ph * 0.42);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `500 ${H() * 0.022}px Outfit,sans-serif`;
    [
      'Respondé rápido → PERFECT ×1.75',
      'Racha sube el multiplicador hasta ×8',
      'Fever 100% = montura + ataques brutales',
      '10 rondas · bosses en 5 y 10'
    ].forEach((l, i) => ctx.fillText(l, W() / 2, py + ph * 0.52 + i * H() * 0.05));

    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.1);
    ctx.fillStyle = `rgba(185,28,28,${0.85 + pulse * 0.15})`;
    ctx.shadowColor = '#E8C547';
    ctx.shadowBlur = 16 + pulse * 10;
    roundRect(ctx, W() / 2 - pw * 0.28, py + ph * 0.78, pw * 0.56, H() * 0.09, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.036}px Cinzel,serif`;
    ctx.fillText('JUGAR', W() / 2, py + ph * 0.825);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = `${H() * 0.02}px Outfit,sans-serif`;
    ctx.fillText('Best: ' + best + ' XP', W() / 2, py + ph * 0.93);
  }

  function drawPlay() {
    drawBG();
    if (enemy) {
      enemy.update();
      enemy.draw();
    }
    knight.x = W() * 0.24;
    knight.y = H() * 0.82;
    knight.update();
    knight.draw();

    // FX
    fxList = fxList.filter((fx) => {
      fx.tick++;
      if (fx.tick >= 3) {
        fx.tick = 0;
        fx.frame++;
      }
      const img = vfxImgs[fx.kind]?.[fx.frame];
      if (img) {
        const s = H() * 0.24 * fx.scale;
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.rot || 0);
        ctx.drawImage(img, -s / 2, -s / 2, s, s);
        ctx.restore();
      }
      return fx.frame < (vfxImgs[fx.kind]?.length || 0);
    });

    particles = particles.filter((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= 0.025;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return p.life > 0;
    });

    floatingTexts = floatingTexts.filter((t) => {
      t.y += t.vy;
      t.vy *= 0.96;
      t.life -= 0.018;
      ctx.save();
      ctx.globalAlpha = t.life;
      ctx.font = `900 ${H() * 0.038 * (t.size || 1)}px Cinzel,serif`;
      ctx.fillStyle = t.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 10;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
      return t.life > 0;
    });

    drawTimer();
    drawQuestion();
    drawOptions();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `${H() * 0.022}px Outfit,sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(`Ronda ${roundCount}/10`, W() - 16, 12);
    if (enemy) {
      ctx.textAlign = 'left';
      ctx.fillStyle = enemy.type.boss ? '#E8C547' : 'rgba(255,255,255,0.5)';
      ctx.fillText(enemy.type.name, 16, 12);
    }
    if (mounted) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E8C547';
      ctx.font = `900 ${H() * 0.028}px Cinzel,serif`;
      ctx.fillText('FEVER MOUNT', W() / 2, H() * 0.13);
      if (frameCount % 18 === 0) sfx('hoof');
    }
  }

  function drawResults() {
    drawBG();
    knight.x = W() * 0.5;
    knight.y = H() * 0.82;
    knight.update();
    knight.draw();
    const won = knight.hp > 0;
    const pw = W() * 0.6,
      ph = H() * 0.7;
    const px = (W() - pw) / 2,
      py = (H() - ph) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = won ? 'rgba(232,197,71,0.7)' : 'rgba(239,68,68,0.6)';
    ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = won ? '#E8C547' : '#ef4444';
    ctx.font = `900 ${H() * 0.07}px Cinzel,serif`;
    ctx.fillText(won ? 'VICTORIA' : 'CAÍDA', W() / 2, py + ph * 0.22);
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.09}px Outfit,sans-serif`;
    ctx.fillText(knight.score + ' XP', W() / 2, py + ph * 0.42);
    ctx.fillStyle = '#94a3b8';
    ctx.font = `${H() * 0.028}px Outfit,sans-serif`;
    ctx.fillText(`Rondas ${roundCount} · Max racha ${knight.streak} · Best ${best}`, W() / 2, py + ph * 0.56);
    const bw = pw * 0.36,
      bh = H() * 0.09,
      by = py + ph * 0.7;
    ctx.fillStyle = '#B91C1C';
    roundRect(ctx, W() / 2 - bw - 10, by, bw, bh, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${H() * 0.032}px Cinzel,serif`;
    ctx.fillText('OTRA', W() / 2 - bw / 2 - 10, by + bh / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    roundRect(ctx, W() / 2 + 10, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('MENÚ', W() / 2 + 10 + bw / 2, by + bh / 2);
    window._retryBtn = { x: W() / 2 - bw - 10, y: by, w: bw, h: bh };
    window._menuBtn = { x: W() / 2 + 10, y: by, w: bw, h: bh };
  }

  // ── INPUT ──
  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.changedTouches ? e.changedTouches[0] : e.touches ? e.touches[0] : e;
    return { x: ((src.clientX - r.left) / r.width) * W(), y: ((src.clientY - r.top) / r.height) * H() };
  }
  canvas.addEventListener('mousemove', (e) => {
    const p = pointerPos(e);
    mouseX = p.x;
    mouseY = p.y;
  });
  function tap(e) {
    if (e.cancelable) e.preventDefault();
    ensureAudio();
    const p = pointerPos(e);
    mouseX = p.x;
    mouseY = p.y;
    sfx('click');
    if (gameState === STATES.MENU) {
      setState(STATES.PLAY);
      return;
    }
    if (gameState === STATES.PLAY) {
      for (const opt of options) {
        if (opt.rect && p.x > opt.rect.x && p.x < opt.rect.x + opt.rect.w && p.y > opt.rect.y && p.y < opt.rect.y + opt.rect.h) {
          answer(opt);
          break;
        }
      }
    }
    if (gameState === STATES.RESULTS) {
      if (window._retryBtn && p.x > _retryBtn.x && p.x < _retryBtn.x + _retryBtn.w && p.y > _retryBtn.y && p.y < _retryBtn.y + _retryBtn.h) setState(STATES.PLAY);
      if (window._menuBtn && p.x > _menuBtn.x && p.x < _menuBtn.x + _menuBtn.w && p.y > _menuBtn.y && p.y < _menuBtn.y + _menuBtn.h) {
        gameState = STATES.MENU;
        knight.state = 'idle';
        knight.setAnim('idle');
        mounted = false;
      }
    }
  }
  canvas.addEventListener('click', tap);
  canvas.addEventListener('touchend', tap, { passive: false });

  // keyboard 1/2/3
  window.addEventListener('keydown', (e) => {
    if (gameState !== STATES.PLAY) return;
    const i = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (i != null && options[i]) answer(options[i]);
  });

  function loop() {
    if (hitstop > 0) {
      hitstop--;
      requestAnimationFrame(loop);
      return;
    }
    frameCount++;
    bgScroll++;
    if (shake > 0) shake--;
    if (flash > 0) flash--;
    fever = Math.max(0, fever - (mounted ? 0.08 : 0.02));
    if (fever < 35) mounted = false;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W(), H());
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    if (gameState === STATES.MENU) drawMenu();
    else if (gameState === STATES.PLAY) drawPlay();
    else drawResults();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,220,180,${flash * 0.04})`;
      ctx.fillRect(0, 0, W(), H());
    }
    ctx.restore();
    requestAnimationFrame(loop);
  }
  updateHUD();
  loop();
})().catch((err) => {
  console.error(err);
  const t = document.getElementById('load-txt');
  if (t) t.textContent = 'Error: ' + err.message + ' — usá JUGAR.bat';
});
</script>
</body>
</html>
