<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tense Raiders — Infinity Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh;background:#07060a;overflow:hidden;font-family:Georgia,serif;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07060a}
  canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;cursor:pointer;touch-action:none}
  #closeBtn{position:fixed;top:10px;right:12px;z-index:3;appearance:none;background:rgba(20,16,12,.85);border:1px solid rgba(232,197,71,.45);color:#E8C547;border-radius:6px;padding:6px 12px;font:800 11px sans-serif;cursor:pointer;letter-spacing:.08em}
</style>
</head>
<body>
<button type="button" id="closeBtn">CERRAR</button>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function () {
  const BUILD = 'tr-orc4';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scene = new Image();
  scene.src = 'assets/raid-scene.png';
  const SRC = { w: 16, h: 9 };
  let dpr = Math.min(devicePixelRatio || 1, 2);
  let view = { x: 0, y: 0, w: 0, h: 0 };

  const TENSES = [
    { id: 'ps', label: 'PRESENT SIMPLE' },
    { id: 'past', label: 'PAST SIMPLE' },
    { id: 'pc', label: 'PRESENT CONTINUOUS' },
    { id: 'pp', label: 'PRESENT PERFECT' }
  ];
  const CLUES = [
    { text: 'Desde 2019 ella TRABAJA aquí.', tense: 'pp' },
    { text: 'Ayer el cliente LLAMÓ molesto.', tense: 'past' },
    { text: 'Ahora mismo ESTOY esperando.', tense: 'pc' },
    { text: 'Ella TRABAJA lunes a viernes.', tense: 'ps' },
    { text: 'He HAS SENT the report already.', tense: 'pp' },
    { text: 'They WENT to the vault last night.', tense: 'past' },
    { text: 'We ARE CLOSING the ticket now.', tense: 'pc' },
    { text: 'He CALLS every Monday.', tense: 'ps' }
  ];

  let you = 0, orcScore = 0, raid = 0, locked = false;
  let clue = CLUES[0];
  let orcTimer = 10, orcBorn = 0, orcMax = 10;
  let hover = -1;
  let mouse = { x: 0, y: 0 };
  let toast = '', toastLife = 0;
  let orcMood = 'idle'; // idle | hurt | win

  function questionTimer() {
    if (raid >= 20) return 3;
    if (raid >= 15) return 6;
    if (raid >= 10) return 8;
    return 10;
  }
  function loadClue() {
    clue = CLUES[raid % CLUES.length];
    orcMax = questionTimer();
    orcTimer = orcMax;
    orcBorn = performance.now();
    locked = false;
    orcMood = 'idle';
  }

  function layout() {
    const iw = scene.naturalWidth || 1920;
    const ih = scene.naturalHeight || 1080;
    SRC.w = iw; SRC.h = ih;
    const maxW = innerWidth, maxH = innerHeight;
    const s = Math.min(maxW / iw, maxH / ih);
    view.w = Math.round(iw * s);
    view.h = Math.round(ih * s);
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    canvas.width = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const px = (n) => n * view.w;
  const py = (n) => n * view.h;

  // % of the 16:9 mock
  const REG = {
    clue: { x: 0.055, y: 0.30, w: 0.48, h: 0.22 },
    tiles: [
      { x: 0.045, y: 0.62, w: 0.25, h: 0.11 },
      { x: 0.305, y: 0.62, w: 0.25, h: 0.11 },
      { x: 0.045, y: 0.75, w: 0.25, h: 0.11 },
      { x: 0.305, y: 0.75, w: 0.25, h: 0.11 }
    ],
    score: { x: 0.34, y: 0.015, w: 0.32, h: 0.08 },
    timer: { x: 0.64, y: 0.195, w: 0.30, h: 0.045 },
    orc: { x: 0.60, y: 0.26, w: 0.34, h: 0.58 },
    eyes: [
      { x: 0.732, y: 0.395 },
      { x: 0.778, y: 0.398 }
    ],
    torches: [
      { x: 0.615, y: 0.68 },
      { x: 0.905, y: 0.70 }
    ],
    orb: { x: 0.845, y: 0.33 }
  };

  function hitTile(mx, my) {
    for (let i = 0; i < 4; i++) {
      const t = REG.tiles[i];
      if (mx >= px(t.x) && mx <= px(t.x + t.w) && my >= py(t.y) && my <= py(t.y + t.h)) return i;
    }
    return -1;
  }

  function drawFlame(x, y, t, phase) {
    const h = view.h * 0.11;
    const w = view.w * 0.035;
    ctx.save();
    ctx.translate(x, y);
    const flick = 0.75 + Math.sin(t * 0.55 + phase) * 0.18 + Math.sin(t * 1.3 + phase * 2) * 0.1;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, h * 0.9);
    g.addColorStop(0, 'rgba(255,240,160,' + (0.55 * flick) + ')');
    g.addColorStop(0.35, 'rgba(251,146,60,' + (0.35 * flick) + ')');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -h * 0.1, h * 0.7, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = t * 0.25 + phase + i * 1.1;
      const fh = h * (0.45 + Math.sin(a) * 0.18 + (i % 2) * 0.08) * flick;
      const fw = w * (0.55 - i * 0.06);
      const ox = Math.sin(a * 1.4) * w * 0.25;
      ctx.beginPath();
      ctx.moveTo(ox - fw, 0);
      ctx.quadraticCurveTo(ox + Math.sin(a) * fw * 0.4, -fh * 0.45, ox, -fh);
      ctx.quadraticCurveTo(ox - Math.sin(a) * fw * 0.4, -fh * 0.45, ox + fw, 0);
      ctx.closePath();
      ctx.fillStyle = i === 0 ? '#fff7cc' : i < 2 ? '#fbbf24' : '#f97316';
      ctx.globalAlpha = 0.95 - i * 0.12;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    const sp = (t * 0.06 + phase) % 1;
    ctx.fillStyle = '#fdba74';
    ctx.globalAlpha = 1 - sp;
    ctx.beginPath();
    ctx.arc(Math.sin(t * 0.2 + phase) * 8, -h * 0.2 - sp * h * 0.7, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawEyes(t) {
    const blink = Math.floor(t / 7) % 55 < 3;
    const lookX = Math.sin(t * 0.035) * view.w * 0.0045;
    const lookY = Math.cos(t * 0.028) * view.h * 0.0035;
    REG.eyes.forEach((e, i) => {
      const x = px(e.x) + lookX + (i ? 1 : -1);
      const y = py(e.y) + lookY;
      const rx = view.w * 0.011;
      const ry = blink ? view.h * 0.002 : view.h * 0.009;
      ctx.fillStyle = '#1a0a00';
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      if (!blink) {
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.ellipse(x + lookX * 0.3, y + lookY * 0.3, rx * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - rx * 0.25, y - ry * 0.25, rx * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function wrap(text, x, y, maxW, lh) {
    const words = String(text).split(' ');
    let line = '', lines = [];
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else line = test;
    }
    if (line) lines.push(line);
    let yy = y - ((lines.length - 1) * lh) / 2;
    lines.forEach((ln) => {
      ctx.fillText(ln, x, yy);
      yy += lh;
    });
  }

  function drawLive(t) {
    const c = REG.clue;
    ctx.fillStyle = '#e9d4a6';
    roundRect(px(c.x), py(c.y), px(c.w), py(c.h), 8);
    ctx.fill();
    ctx.fillStyle = '#2a1810';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(view.h * 0.038) + 'px Georgia,serif';
    wrap(clue.text, px(c.x + c.w / 2), py(c.y + c.h * 0.42), px(c.w) * 0.92, view.h * 0.042);
    ctx.fillStyle = '#7a4a18';
    ctx.font = '700 ' + Math.round(view.h * 0.022) + 'px Georgia,serif';
    ctx.fillText('¿Qué tiempo es?', px(c.x + c.w / 2), py(c.y + c.h * 0.82));

    hover = hitTile(mouse.x, mouse.y);
    REG.tiles.forEach((tile, i) => {
      if (hover === i && !locked) {
        ctx.strokeStyle = '#E8C547';
        ctx.lineWidth = 4;
        roundRect(px(tile.x), py(tile.y), px(tile.w), py(tile.h), 8);
        ctx.stroke();
      }
    });

    const s = REG.score;
    ctx.fillStyle = 'rgba(8,6,10,0.72)';
    roundRect(px(s.x), py(s.y), px(s.w), py(s.h), 8);
    ctx.fill();
    ctx.font = '900 ' + Math.round(view.h * 0.036) + 'px Georgia,serif';
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText('YOU  ' + you, px(s.x + s.w * 0.28), py(s.y + s.h * 0.55));
    ctx.fillStyle = '#fca5a5';
    ctx.fillText(orcScore + '  ORC', px(s.x + s.w * 0.72), py(s.y + s.h * 0.55));
    ctx.fillStyle = '#E8C547';
    ctx.font = '700 ' + Math.round(view.h * 0.016) + 'px sans-serif';
    ctx.fillText('—', px(s.x + s.w * 0.5), py(s.y + s.h * 0.55));

    const b = REG.timer;
    const pct = Math.max(0, orcTimer / orcMax);
    ctx.fillStyle = 'rgba(20,12,8,0.85)';
    roundRect(px(b.x), py(b.y), px(b.w), py(b.h), 6);
    ctx.fill();
    ctx.fillStyle = pct > 0.4 ? '#E8C547' : pct > 0.2 ? '#fb923c' : '#ef4444';
    if (pct > 0.01) {
      roundRect(px(b.x), py(b.y), px(b.w) * pct, py(b.h), 6);
      ctx.fill();
    }
    ctx.fillStyle = '#fff8e7';
    ctx.font = '800 ' + Math.round(view.h * 0.018) + 'px sans-serif';
    ctx.fillText('ORC BUZZ  0:' + String(Math.max(0, Math.ceil(orcTimer))).padStart(2, '0'), px(b.x + b.w / 2), py(b.y + b.h / 2));

    if (toastLife > 0) {
      ctx.globalAlpha = Math.min(1, toastLife);
      ctx.fillStyle = '#E8C547';
      ctx.font = '900 ' + Math.round(view.h * 0.045) + 'px Georgia,serif';
      ctx.fillText(toast, view.w * 0.5, view.h * 0.12);
      ctx.globalAlpha = 1;
    }
    if (you >= 5 || orcScore >= 5) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.fillStyle = you >= 5 ? '#86efac' : '#fca5a5';
      ctx.font = '900 ' + Math.round(view.h * 0.06) + 'px Georgia,serif';
      ctx.fillText(you >= 5 ? 'RAID CLEAR' : 'ORC WINS', view.w / 2, view.h * 0.46);
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.round(view.h * 0.024) + 'px sans-serif';
      ctx.fillText('Tocá para otro raid', view.w / 2, view.h * 0.54);
    }
  }

  function answer(i) {
    if (locked || you >= 5 || orcScore >= 5) return;
    locked = true;
    if (TENSES[i].id === clue.tense) {
      you++;
      orcMood = 'hurt';
      toast = 'TU PUNTO';
    } else {
      orcScore++;
      orcMood = 'hurt';
      toast = 'ORC TOMA EL PUNTO';
    }
    toastLife = 1;
    setTimeout(next, 850);
  }
  function orcSteals() {
    if (locked) return;
    locked = true;
    orcScore++;
    orcMood = 'hurt';
    toast = 'DEMASIADO LENTO';
    toastLife = 1;
    setTimeout(next, 850);
  }
  function next() {
    if (you >= 5 || orcScore >= 5) return;
    raid++;
    loadClue();
  }

  function loop() {
    requestAnimationFrame(loop);
    if (!scene.naturalWidth) return;
    if (!view.w) layout();
    const t = performance.now() / 16;
    if (!locked && you < 5 && orcScore < 5) {
      orcTimer = Math.max(0, orcMax - (performance.now() - orcBorn) / 1000);
      if (orcTimer <= 0) orcSteals();
    }
    if (toastLife > 0) toastLife -= 0.02;

    ctx.clearRect(0, 0, view.w, view.h);
    ctx.drawImage(scene, 0, 0, view.w, view.h);

    const o = REG.orc;
    const breathe = 1 + Math.sin(t * 0.07) * 0.018;
    const shake = orcMood === 'hurt' && toastLife > 0.4 ? Math.sin(t * 1.4) * 6 : 0;
    ctx.save();
    ctx.beginPath();
    ctx.rect(px(o.x), py(o.y), px(o.w), py(o.h));
    ctx.clip();
    const feetX = px(o.x + o.w * 0.52) + shake;
    const feetY = py(o.y + o.h * 0.92);
    ctx.translate(feetX, feetY);
    ctx.scale(1, breathe);
    ctx.translate(-feetX, -feetY);
    ctx.drawImage(scene, 0, 0, view.w, view.h);
    ctx.restore();

    drawEyes(t);
    REG.torches.forEach((tr, i) => drawFlame(px(tr.x), py(tr.y), t, i * 1.7));

    const orb = REG.orb;
    const pulse = 10 + Math.sin(t * 0.15) * 5;
    const og = ctx.createRadialGradient(px(orb.x), py(orb.y), 2, px(orb.x), py(orb.y), pulse + 12);
    og.addColorStop(0, 'rgba(190,255,170,0.55)');
    og.addColorStop(1, 'transparent');
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.arc(px(orb.x), py(orb.y), pulse + 12, 0, Math.PI * 2);
    ctx.fill();

    drawLive(t);
  }

  scene.onload = function () {
    layout();
    loadClue();
    loop();
  };
  addEventListener('resize', layout);
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  canvas.addEventListener('pointerup', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    if (you >= 5 || orcScore >= 5) {
      you = 0; orcScore = 0; raid = 0; loadClue(); return;
    }
    const i = hitTile(mouse.x, mouse.y);
    if (i >= 0) answer(i);
  });
  addEventListener('keydown', (e) => {
    const i = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
    if (i != null) answer(i);
  });
  document.getElementById('closeBtn').onclick = () => {
    if (parent !== window) parent.postMessage({ type: 'arcade-close' }, '*');
  };
  console.info('[Tense Raiders]', BUILD);
})();
</script>
</body>
</html>
