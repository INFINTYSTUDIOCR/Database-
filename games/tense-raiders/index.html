<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tense Raiders — Infinity Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;height:100dvh;background:#07060a;overflow:hidden;font-family:Georgia,serif;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07060a}
  canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;cursor:pointer;touch-action:none}
  #closeBtn{position:fixed;top:10px;right:12px;z-index:3;appearance:none;background:rgba(20,16,12,.85);border:1px solid rgba(232,197,71,.45);color:#E8C547;border-radius:6px;padding:6px 12px;font:800 11px sans-serif;cursor:pointer;letter-spacing:.08em}
</style>
</head>
<body>
<button type="button" id="closeBtn">CERRAR</button>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function () {
  const BUILD = 'tr-orc9';
  const WIN = 7;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scene = new Image();
  scene.src = 'assets/raid-bg.png';
  const SHEETS = {
    idle: { src: 'assets/orc-idle-sheet.png', frames: 4, fps: 6, loop: true, img: null },
    laugh: { src: 'assets/orc-laugh-sheet.png', frames: 4, fps: 8, loop: true, img: null },
    angry: { src: 'assets/orc-angry-sheet.png', frames: 4, fps: 9, loop: true, img: null },
    hurt: { src: 'assets/orc-hurt-sheet.png', frames: 4, fps: 10, loop: false, img: null },
    cry: { src: 'assets/orc-cry-sheet.png', frames: 4, fps: 6, loop: true, img: null }
  };
  let animKey = 'idle';
  let animBorn = 0;

  function punchSheet(img) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    const id = x.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    const w = c.width, h = c.height;
    function at(px, py) { return (py * w + px) * 4; }
    function isBg(i) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const sat = max ? (max - min) / max : 0;
      const lum = (r + g + b) / 3;
      if (lum < 48 && sat < 0.4) return true;
      if (sat < 0.14 && lum > 60 && lum < 230) return true;
      return false;
    }
    const seen = new Uint8Array(w * h);
    const q = [];
    function push(px, py) {
      if (px < 0 || py < 0 || px >= w || py >= h) return;
      const n = py * w + px;
      if (seen[n]) return;
      if (!isBg(at(px, py))) return;
      seen[n] = 1;
      q.push(px, py);
    }
    for (let px = 0; px < w; px++) { push(px, 0); push(px, h - 1); }
    for (let py = 0; py < h; py++) { push(0, py); push(w - 1, py); }
    while (q.length) {
      const py = q.pop();
      const px = q.pop();
      d[at(px, py) + 3] = 0;
      push(px + 1, py); push(px - 1, py); push(px, py + 1); push(px, py - 1);
    }
    x.putImageData(id, 0, 0);
    return c;
  }

  function loadSheets() {
    return Promise.all(Object.keys(SHEETS).map(function (key) {
      return new Promise(function (res) {
        const im = new Image();
        im.onload = function () {
          SHEETS[key].img = punchSheet(im);
          res();
        };
        im.src = SHEETS[key].src;
      });
    }));
  }

  function playAnim(key) {
    if (animKey === key) return;
    animKey = key;
    animBorn = performance.now();
  }

  function sheetKey() {
    if (you >= WIN) return 'cry';
    if (orcScore >= WIN) return 'laugh';
    if (orcMood === 'laugh' || orcMood === 'mock') return 'laugh';
    if (orcMood === 'angry') return 'angry';
    if (orcMood === 'hurt') return 'hurt';
    if (orcMood === 'cry') return 'cry';
    return 'idle';
  }
  let dpr = Math.min(devicePixelRatio || 1, 2);
  let view = { w: 0, h: 0 };

  const T = {
    ps: 'PRESENT SIMPLE',
    pc: 'PRESENT CONTINUOUS',
    pp: 'PRESENT PERFECT',
    ppc: 'PRES. PERF. CONT.',
    past: 'PAST SIMPLE',
    pac: 'PAST CONTINUOUS',
    pap: 'PAST PERFECT',
    papc: 'PAST PERF. CONT.',
    will: 'FUTURE WILL',
    gonna: 'GOING TO',
    fc: 'FUTURE CONTINUOUS',
    fp: 'FUTURE PERFECT',
    used: 'USED TO',
    cond: 'CONDITIONAL'
  };
  const ALL = Object.keys(T);

  const BANK = [
    { text: 'Desde 2019 ella TRABAJA aquí.', ask: '¿Qué tiempo es?', id: 'pp' },
    { text: 'Ayer el cliente LLAMÓ molesto.', ask: '¿Qué tiempo es?', id: 'past' },
    { text: 'Ahora mismo ESTOY esperando la llamada.', ask: '¿Qué tiempo es?', id: 'pc' },
    { text: 'Ella TRABAJA lunes a viernes.', ask: '¿Qué tiempo es?', id: 'ps' },
    { text: 'He HAS SENT the report already.', ask: 'Name the tense', id: 'pp' },
    { text: 'They WENT to the vault last night.', ask: 'Name the tense', id: 'past' },
    { text: 'We ARE CLOSING the ticket now.', ask: 'Name the tense', id: 'pc' },
    { text: 'He CALLS every Monday.', ask: 'Name the tense', id: 'ps' },
    { text: 'Cuando llegué, el lead YA SE HABÍA IDO.', ask: '¿Qué tiempo es?', id: 'pap' },
    { text: 'Mientras yo tipaba, ella ESTABA ESCUCHANDO.', ask: '¿Qué tiempo es?', id: 'pac' },
    { text: 'Llevo TRES HORAS esperando. I HAVE BEEN WAITING.', ask: '¿Qué tiempo es?', id: 'ppc' },
    { text: 'Mañana VOY A LLAMAR al cliente.', ask: '¿Qué tiempo es?', id: 'gonna' },
    { text: 'El bot WILL SEND the SMS at 3.', ask: 'Name the tense', id: 'will' },
    { text: 'This time tomorrow we WILL BE FLYING.', ask: 'Name the tense', id: 'fc' },
    { text: 'By Friday she WILL HAVE FINISHED the deck.', ask: 'Name the tense', id: 'fp' },
    { text: 'Antes yo FUMABA. I USED TO smoke.', ask: '¿Qué tiempo es?', id: 'used' },
    { text: 'Si el pago falla, WE WILL ESCALATE.', ask: 'Name the tense', id: 'will' },
    { text: 'Si yo fuera vos, I WOULD CALL now.', ask: 'Name the tense', id: 'cond' },
    { text: 'She HAS BEEN WORKING here for 4 years.', ask: 'Name the tense', id: 'ppc' },
    { text: 'When I arrived, they HAD ALREADY LEFT.', ask: 'Name the tense', id: 'pap' },
    { text: 'At 5pm I WAS STILL TYPING the email.', ask: 'Name the tense', id: 'pac' },
    { text: 'I HAD BEEN WAITING an hour when he called.', ask: 'Name the tense', id: 'papc' },
    { text: 'Había estado lloviendo todo el día.', ask: '¿Qué tiempo es?', id: 'papc' },
    { text: 'Para mañana ya HABRÉ ENVIADO el reporte.', ask: '¿Qué tiempo es?', id: 'fp' },
    { text: 'A esta hora mañana ESTAREMOS EN LA REUNIÓN.', ask: '¿Qué tiempo es?', id: 'fc' },
    { text: 'Cada lunes el equipo RUNS QA.', ask: 'Name the tense', id: 'ps' },
    { text: 'Right now I AM REVIEWING the ticket.', ask: 'Name the tense', id: 'pc' },
    { text: 'We HAVE NOT RECEIVED the email yet.', ask: 'Name the tense', id: 'pp' },
    { text: 'Yesterday at 3 the bot SENT the SMS.', ask: 'Name the tense', id: 'past' },
    { text: 'SIGNAL: AYER / LAST NIGHT / IN 2019', ask: '¿Qué tiempo marca?', id: 'past' },
    { text: 'SIGNAL: SINCE / FOR / ALREADY / YET', ask: '¿Qué tiempo marca?', id: 'pp' },
    { text: 'SIGNAL: NOW / RIGHT NOW / AT THE MOMENT', ask: '¿Qué tiempo marca?', id: 'pc' },
    { text: 'SIGNAL: EVERY / ALWAYS / USUALLY / ON MONDAYS', ask: '¿Qué tiempo marca?', id: 'ps' },
    { text: 'SIGNAL: WHILE / AS / AT 5PM (pasado)', ask: '¿Qué tiempo marca?', id: 'pac' },
    { text: 'SIGNAL: BY THE TIME / ALREADY + pasado', ask: '¿Qué tiempo marca?', id: 'pap' },
    { text: 'SIGNAL: TOMORROW / NEXT WEEK + will', ask: '¿Qué tiempo marca?', id: 'will' },
    { text: 'SIGNAL: GOING TO / VOY A', ask: '¿Qué tiempo marca?', id: 'gonna' },
    { text: 'SIGNAL: FOR 3 HOURS + still happening', ask: '¿Qué tiempo marca?', id: 'ppc' },
    { text: 'HAVE / HAS + past participle (V3)', ask: 'Esa fórmula es…', id: 'pp' },
    { text: 'AM / IS / ARE + V-ing', ask: 'Esa fórmula es…', id: 'pc' },
    { text: 'HAD + past participle (V3)', ask: 'Esa fórmula es…', id: 'pap' },
    { text: 'WILL + HAVE + V3', ask: 'Esa fórmula es…', id: 'fp' },
    { text: 'WAS / WERE + V-ing', ask: 'Esa fórmula es…', id: 'pac' },
    { text: 'WILL + BE + V-ing', ask: 'Esa fórmula es…', id: 'fc' },
    { text: 'HAVE / HAS + BEEN + V-ing', ask: 'Esa fórmula es…', id: 'ppc' },
    { text: 'USED TO + infinitive', ask: 'Esa fórmula es…', id: 'used' },
    { text: 'WOULD + infinitive (si yo fuera…)', ask: 'Esa fórmula es…', id: 'cond' },
    { text: '“I live in CR.” = vivo / habito, no ahora mismo.', ask: 'Name the tense', id: 'ps' },
    { text: '“I’m living in CR this month.” = temporal, ahora.', ask: 'Name the tense', id: 'pc' },
    { text: '“I have lived here since 2020.” = desde entonces.', ask: 'Name the tense', id: 'pp' },
    { text: '“I lived there in 2018.” = terminado, fecha.', ask: 'Name the tense', id: 'past' },
    { text: 'No uses HAVE con YESTERDAY. Ayer = …', ask: '¿Qué tiempo?', id: 'past' },
    { text: 'No uses PAST SIMPLE con SINCE. Since = …', ask: '¿Qué tiempo?', id: 'pp' }
  ];

  const MOCK = [
    'JAJA. Ni el tense viste.',
    'Demasiado lento, humano.',
    'Ese no era. Punto mío.',
    '¿Eso era tu buzz? Patético.',
    'Los tenses no te quieren.',
    'Otra vez fallás. Classic.'
  ];
  const CHALLENGE = [
    'Buzz si te atrevés.',
    'Este tense es MÍO.',
    'Nombralo. Si podés.',
    'EN o ES, yo gano igual.',
    'Apurate. La barra es mía.',
    '¿Todos los tenses? Ja.'
  ];
  const ANGRY = [
    'NOOO. Eso era mío.',
    'Suerte. No va a durar.',
    'Cállate y buzz otra.',
    'Me estás copiando el tense.',
    'No te rías. TODAVÍA juego.',
    'ARGH. Otra. AHORA.'
  ];
  const WIN_MOCK = [
    'Los tenses son míos.',
    'Volvé cuando sepas SINCE.',
    'Raid over. Yo mando.'
  ];
  const LOSE_RAGE = [
    'NOOO ESTO ERA MÍO.',
    'Trampa. Revancha.',
    'Los tenses no se rinden.'
  ];

  let you = 0, orcScore = 0, asked = 0, locked = false;
  let deck = [];
  let clue = BANK[0];
  let options = [];
  let orcTimer = 10, orcBorn = 0, orcMax = 10;
  let hover = -1;
  let mouse = { x: 0, y: 0 };
  let toast = '', toastLife = 0;
  let orcMood = 'challenge';
  let orcLine = CHALLENGE[0];
  let orcLineLife = 1;

  function shuffle(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function questionTimer() {
    if (asked >= 20) return 3;
    if (asked >= 15) return 6;
    if (asked >= 10) return 8;
    return 10;
  }
  function refill() { deck = shuffle(BANK); }
  function loadClue() {
    if (!deck.length) refill();
    clue = deck.pop();
    const others = shuffle(ALL.filter((id) => id !== clue.id)).slice(0, 3);
    options = shuffle([clue.id].concat(others));
    orcMax = questionTimer();
    orcTimer = orcMax;
    orcBorn = performance.now();
    locked = false;
    if (you >= WIN || orcScore >= WIN) return;
    if (you > orcScore) {
      orcMood = 'angry';
      orcLine = pick(ANGRY);
    } else {
      orcMood = 'idle';
      orcLine = pick(CHALLENGE);
    }
    orcLineLife = 1;
  }

  function layout() {
    const iw = scene.naturalWidth || 1920;
    const ih = scene.naturalHeight || 1080;
    const s = Math.min(innerWidth / iw, innerHeight / ih);
    view.w = Math.round(iw * s);
    view.h = Math.round(ih * s);
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    canvas.width = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const px = (n) => n * view.w;
  const py = (n) => n * view.h;

  const REG = {
    board: { x: 0.025, y: 0.115, w: 0.555, h: 0.77 },
    clue: { x: 0.05, y: 0.20, w: 0.50, h: 0.36 },
    tiles: [
      { x: 0.038, y: 0.595, w: 0.258, h: 0.13 },
      { x: 0.304, y: 0.595, w: 0.258, h: 0.13 },
      { x: 0.038, y: 0.738, w: 0.258, h: 0.13 },
      { x: 0.304, y: 0.738, w: 0.258, h: 0.13 }
    ],
    score: { x: 0.32, y: 0.008, w: 0.36, h: 0.09 },
    raid: { x: 0.03, y: 0.078, w: 0.30, h: 0.055 },
    timer: { x: 0.64, y: 0.195, w: 0.30, h: 0.045 },
    orc: { x: 0.56, y: 0.10, w: 0.42, h: 0.82 },
    eyes: [
      { x: 0.705, y: 0.355 },
      { x: 0.768, y: 0.358 }
    ],
    bubble: { x: 0.46, y: 0.20, w: 0.18, h: 0.16 }
  };

  function hitTile(mx, my) {
    for (let i = 0; i < 4; i++) {
      const t = REG.tiles[i];
      if (mx >= px(t.x) && mx <= px(t.x + t.w) && my >= py(t.y) && my <= py(t.y + t.h)) return i;
    }
    return -1;
  }

  function drawOrc(now) {
    playAnim(sheetKey());
    const sh = SHEETS[animKey];
    if (!sh || !sh.img) return;
    const img = sh.img;
    const fw = img.width / sh.frames;
    const fh = img.height;
    const elapsed = (now - animBorn) / 1000;
    let fi = Math.floor(elapsed * sh.fps);
    if (sh.loop) fi = fi % sh.frames;
    else fi = Math.min(sh.frames - 1, fi);
    const o = REG.orc;
    const boxW = px(o.w);
    const boxH = py(o.h);
    const scale = Math.min(boxW / fw, boxH / fh) * 0.95;
    const dw = fw * scale;
    const dh = fh * scale;
    const dx = px(o.x + o.w / 2) - dw / 2;
    const dy = py(o.y + o.h) - dh;
    ctx.drawImage(img, fi * fw, 0, fw, fh, dx, dy, dw, dh);
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function wrap(text, x, y, maxW, lh) {
    const words = String(text).split(' ');
    let line = '', lines = [];
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else line = test;
    }
    if (line) lines.push(line);
    let yy = y - ((lines.length - 1) * lh) / 2;
    lines.forEach((ln) => { ctx.fillText(ln, x, yy); yy += lh; });
  }

  function drawBubble() {
    const b = REG.bubble;
    ctx.fillStyle = orcMood === 'angry' ? '#7f1d1d' : orcMood === 'mock' ? '#3f2a08' : '#1e1430';
    roundRect(px(b.x), py(b.y), px(b.w), py(b.h), 10);
    ctx.fill();
    ctx.strokeStyle = orcMood === 'angry' ? '#fca5a5' : '#E8C547';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px(b.x + b.w * 0.85), py(b.y + b.h * 0.55));
    ctx.lineTo(px(b.x + b.w + 0.02), py(b.y + b.h * 0.72));
    ctx.lineTo(px(b.x + b.w * 0.7), py(b.y + b.h * 0.78));
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff8e7';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(view.h * 0.018) + 'px Georgia,serif';
    wrap(orcLine, px(b.x + b.w / 2), py(b.y + b.h * 0.45), px(b.w) * 0.88, view.h * 0.022);
  }

  function drawLive() {
    const board = REG.board;
    ctx.fillStyle = '#1a1210';
    ctx.fillRect(px(board.x), py(board.y), px(board.w), py(board.h));
    ctx.fillStyle = '#221610';
    for (let row = 0; row < 6; row++) {
      ctx.fillRect(px(board.x), py(board.y) + row * py(board.h) / 6, px(board.w), 2);
    }

    const c = REG.clue;
    ctx.fillStyle = '#5c3a22';
    roundRect(px(c.x) - 6, py(c.y) - 6, px(c.w) + 12, py(c.h) + 12, 10);
    ctx.fill();
    ctx.fillStyle = '#e9d4a6';
    roundRect(px(c.x), py(c.y), px(c.w), py(c.h), 8);
    ctx.fill();
    ctx.fillStyle = '#9b1c1c';
    roundRect(px(c.x + c.w * 0.32), py(c.y) - view.h * 0.028, px(c.w * 0.36), view.h * 0.045, 4);
    ctx.fill();
    ctx.fillStyle = '#fff8e7';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(view.h * 0.02) + 'px Georgia,serif';
    ctx.fillText('CLUE', px(c.x + c.w / 2), py(c.y) - view.h * 0.006);
    ctx.fillStyle = '#2a1810';
    ctx.font = '800 ' + Math.round(view.h * 0.032) + 'px Georgia,serif';
    wrap(clue.text, px(c.x + c.w / 2), py(c.y + c.h * 0.42), px(c.w) * 0.9, view.h * 0.036);
    ctx.fillStyle = '#7a4a18';
    ctx.font = '700 ' + Math.round(view.h * 0.02) + 'px Georgia,serif';
    ctx.fillText(clue.ask || '¿Qué tiempo es?', px(c.x + c.w / 2), py(c.y + c.h * 0.84));

    hover = hitTile(mouse.x, mouse.y);
    options.forEach((id, i) => {
      const tile = REG.tiles[i];
      const over = hover === i && !locked;
      ctx.fillStyle = '#1a120e';
      roundRect(px(tile.x), py(tile.y), px(tile.w), py(tile.h), 8);
      ctx.fill();
      ctx.strokeStyle = over ? '#E8C547' : '#4a3720';
      ctx.lineWidth = over ? 4 : 2;
      ctx.stroke();
      ctx.fillStyle = '#E8C547';
      ctx.font = '800 ' + Math.round(view.h * 0.018) + 'px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(String(i + 1), px(tile.x) + 12, py(tile.y) + py(tile.h) * 0.28);
      ctx.fillStyle = '#fff8e7';
      ctx.textAlign = 'center';
      ctx.font = '800 ' + Math.round(Math.min(view.h * 0.024, px(tile.w) * 0.09)) + 'px sans-serif';
      wrap(T[id], px(tile.x + tile.w / 2), py(tile.y + tile.h * 0.58), px(tile.w) * 0.88, view.h * 0.024);
    });

    const s = REG.score;
    ctx.fillStyle = '#0c0a0c';
    roundRect(px(s.x), py(s.y), px(s.w), py(s.h), 8);
    ctx.fill();
    ctx.font = '900 ' + Math.round(view.h * 0.036) + 'px Georgia,serif';
    ctx.fillStyle = '#7dd3fc';
    ctx.fillText('YOU  ' + you, px(s.x + s.w * 0.28), py(s.y + s.h * 0.55));
    ctx.fillStyle = '#fca5a5';
    ctx.fillText(orcScore + '  ORC', px(s.x + s.w * 0.72), py(s.y + s.h * 0.55));

    const r = REG.raid;
    ctx.fillStyle = '#0c0a0c';
    roundRect(px(r.x), py(r.y), px(r.w), py(r.h), 6);
    ctx.fill();
    ctx.fillStyle = '#E8C547';
    ctx.font = '800 ' + Math.round(view.h * 0.018) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('ALL TENSES  ·  first to ' + WIN, px(r.x) + 10, py(r.y + r.h * 0.55));

    const b = REG.timer;
    const pct = Math.max(0, orcTimer / orcMax);
    ctx.fillStyle = 'rgba(20,12,8,0.85)';
    roundRect(px(b.x), py(b.y), px(b.w), py(b.h), 6);
    ctx.fill();
    ctx.fillStyle = pct > 0.4 ? '#E8C547' : pct > 0.2 ? '#fb923c' : '#ef4444';
    if (pct > 0.01) {
      roundRect(px(b.x), py(b.y), px(b.w) * pct, py(b.h), 6);
      ctx.fill();
    }
    ctx.fillStyle = '#fff8e7';
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(view.h * 0.018) + 'px sans-serif';
    ctx.fillText('ORC BUZZ  0:' + String(Math.max(0, Math.ceil(orcTimer))).padStart(2, '0'), px(b.x + b.w / 2), py(b.y + b.h / 2));

    drawBubble();

    if (toastLife > 0) {
      ctx.globalAlpha = Math.min(1, toastLife);
      ctx.fillStyle = '#E8C547';
      ctx.font = '900 ' + Math.round(view.h * 0.04) + 'px Georgia,serif';
      ctx.fillText(toast, view.w * 0.5, view.h * 0.12);
      ctx.globalAlpha = 1;
    }
    if (you >= WIN || orcScore >= WIN) {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, view.w, view.h);
      ctx.fillStyle = you >= WIN ? '#86efac' : '#fca5a5';
      ctx.font = '900 ' + Math.round(view.h * 0.055) + 'px Georgia,serif';
      ctx.fillText(you >= WIN ? 'RAID CLEAR' : 'ORC WINS', view.w / 2, view.h * 0.46);
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.round(view.h * 0.022) + 'px sans-serif';
      ctx.fillText('Tocá para otro raid', view.w / 2, view.h * 0.54);
    }
  }

  function done() { return you >= WIN || orcScore >= WIN; }

  function answer(i) {
    if (locked || done() || !options[i]) return;
    locked = true;
    asked++;
    if (options[i] === clue.id) {
      you++;
      orcMood = you >= WIN ? 'cry' : 'hurt';
      orcLine = you >= WIN ? pick(LOSE_RAGE) : pick(ANGRY);
      toast = 'TU PUNTO';
    } else {
      orcScore++;
      orcMood = 'laugh';
      orcLine = orcScore >= WIN ? pick(WIN_MOCK) : pick(MOCK) + ' Era ' + T[clue.id] + '.';
      toast = 'ORC SE BURLA';
    }
    orcLineLife = 1;
    toastLife = 1;
    setTimeout(next, 900);
  }
  function orcSteals() {
    if (locked || done()) return;
    locked = true;
    asked++;
    orcScore++;
    orcMood = 'laugh';
    orcLine = orcScore >= WIN ? pick(WIN_MOCK) : 'Se acabó. Era ' + T[clue.id] + '.';
    toast = 'DEMASIADO LENTO';
    toastLife = 1;
    orcLineLife = 1;
    setTimeout(next, 900);
  }
  function next() {
    if (done()) return;
    loadClue();
  }
  function resetRaid() {
    you = 0; orcScore = 0; asked = 0;
    refill();
    loadClue();
  }

  function loop() {
    requestAnimationFrame(loop);
    if (!scene.naturalWidth) return;
    if (!view.w) layout();
    if (!locked && !done()) {
      orcTimer = Math.max(0, orcMax - (performance.now() - orcBorn) / 1000);
      if (orcTimer <= 0) orcSteals();
    }
    if (toastLife > 0) toastLife -= 0.018;
    if (orcLineLife > 0) orcLineLife -= 0.004;

    ctx.clearRect(0, 0, view.w, view.h);
    ctx.drawImage(scene, 0, 0, view.w, view.h);
    drawOrc(performance.now());
    drawLive();
  }

  Promise.all([
    new Promise(function (res) {
      if (scene.complete && scene.naturalWidth) res();
      else scene.onload = res;
    }),
    loadSheets()
  ]).then(function () {
    layout();
    refill();
    loadClue();
    playAnim('idle');
    loop();
  });
  addEventListener('resize', layout);
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
  });
  canvas.addEventListener('pointerup', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    if (done()) { resetRaid(); return; }
    const i = hitTile(mouse.x, mouse.y);
    if (i >= 0) answer(i);
  });
  addEventListener('keydown', (e) => {
    const i = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[e.code];
    if (i != null) answer(i);
  });
  document.getElementById('closeBtn').onclick = () => {
    if (parent !== window) parent.postMessage({ type: 'arcade-close' }, '*');
  };
  console.info('[Tense Raiders]', BUILD, BANK.length, 'clues');
})();
</script>
</body>
</html>
