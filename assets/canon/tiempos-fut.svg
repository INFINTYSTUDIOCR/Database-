<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Futuro will / going to">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="28" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="13" font-weight="bold">FUTURO - will / going to</text>
  <text x="160" y="46" text-anchor="middle" fill="#6d28d9" font-size="10">P + will + V base + C</text>
  <rect x="28" y="62" width="264" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="48" y="82" fill="#5B21B6" font-size="13" font-weight="bold">will</text>
  <text x="100" y="82" fill="#312e81" font-size="12">P + will + V + C</text>
  <text x="230" y="82" text-anchor="middle" fill="#D97706" font-size="12" font-weight="bold">I will work</text>
  <text x="48" y="98" fill="#312e81" font-size="10">going to: P + be + going to + V</text>
  <text x="160" y="132" text-anchor="middle" fill="#312e81" font-size="11">I am going to work tomorrow</text>
  <text x="160" y="156" text-anchor="middle" fill="#6d28d9" font-size="9">Futuro perfecto: will have + V3 (I will have finished)</text>
</svg>
