    <rect x="16" y="446" width="688" height="20" fill="#f8f5ff"/><text x="60" y="460" text-anchor="middle" fill="#D97706" font-weight="700">send</text><text x="180" y="460" text-anchor="middle" fill="#312e81">sent</text><text x="380" y="460" text-anchor="middle" fill="#0284c7">have/has sent</text><text x="580" y="460" text-anchor="middle" fill="#059669">had sent</text>
    <rect x="16" y="466" width="688" height="20" fill="#ede9fe"/><text x="60" y="480" text-anchor="middle" fill="#D97706" font-weight="700">seem</text><text x="180" y="480" text-anchor="middle" fill="#312e81">seemed</text><text x="380" y="480" text-anchor="middle" fill="#0284c7">have/has seemed</text><text x="580" y="480" text-anchor="middle" fill="#059669">had seemed</text>
