  <text x="360" y="510" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="600">HAVE = I/You/We/They · HAS = He/She/It · HAD = todos · *BEEN ’ activa ING</text>
  <text x="360" y="528" text-anchor="middle" fill="#db2777" font-size="10">¿Sigue ahora? ’ BEEN+ING · ¿Antes de otro pasado? ’ HAD+PP · ¿Afecta ahora sin cuándo? ’ HAVE+PP</text>
  <text x="360" y="546" text-anchor="middle" fill="#6d28d9" font-size="10">Conecta M1+M2+M3 ’ conversación real compleja</text>
</svg>
