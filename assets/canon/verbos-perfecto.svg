<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Modulo 4  Perfecto HAVE/HAS/HAD + BEEN+ING">
  <rect width="720" height="560" rx="14" fill="#f8f5ff"/>
  <text x="360" y="22" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">MODULO 4  PERFECTO · HAVE / HAS / HAD + BEEN+ING</text>
  <text x="360" y="40" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="10">Español HABER+participio · BEEN activa ING · piezas LEGO</text>

  <!-- 4 structures -->
  <rect x="16" y="50" width="168" height="58" rx="8" fill="#ede9fe" stroke="#5B21B6"/>
  <text x="100" y="70" text-anchor="middle" fill="#5B21B6" font-size="10" font-weight="700">PRESENTE PERFECTO</text>
  <text x="100" y="86" text-anchor="middle" fill="#312e81" font-size="10">HAVE/HAS + PP</text>
  <text x="100" y="100" text-anchor="middle" fill="#059669" font-size="9">he / ha + participio</text>

  <rect x="192" y="50" width="168" height="58" rx="8" fill="#ede9fe" stroke="#5B21B6"/>
  <text x="276" y="70" text-anchor="middle" fill="#5B21B6" font-size="10" font-weight="700">PASADO PERFECTO</text>
  <text x="276" y="86" text-anchor="middle" fill="#312e81" font-size="10">HAD + PP</text>
  <text x="276" y="100" text-anchor="middle" fill="#059669" font-size="9">había + participio</text>

  <rect x="368" y="50" width="168" height="58" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="452" y="70" text-anchor="middle" fill="#db2777" font-size="10" font-weight="700">PRES. PERF. CONT.</text>
  <text x="452" y="86" text-anchor="middle" fill="#312e81" font-size="10">HAVE/HAS + BEEN + ING</text>
  <text x="452" y="100" text-anchor="middle" fill="#059669" font-size="9">he estado + ando/endo</text>

  <rect x="544" y="50" width="160" height="58" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="624" y="70" text-anchor="middle" fill="#db2777" font-size="10" font-weight="700">PAS. PERF. CONT.</text>
  <text x="624" y="86" text-anchor="middle" fill="#312e81" font-size="10">HAD + BEEN + ING</text>
  <text x="624" y="100" text-anchor="middle" fill="#059669" font-size="9">había estado + ando</text>

  <rect x="16" y="118" width="688" height="24" rx="6" fill="#5B21B6"/>
  <text x="60" y="134" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">VERBO</text>
  <text x="180" y="134" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">PARTICIPIO</text>
  <text x="380" y="134" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">HAVE/HAS + PP</text>
  <text x="580" y="134" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">HAD + PP</text>

  <g font-family="Inter,Segoe UI,sans-serif" font-size="10">
    <rect x="16" y="146" width="688" height="20" fill="#ede9fe"/><text x="60" y="160" text-anchor="middle" fill="#D97706" font-weight="700">be</text><text x="180" y="160" text-anchor="middle" fill="#db2777" font-weight="700">been*</text><text x="380" y="160" text-anchor="middle" fill="#0284c7">have/has been</text><text x="580" y="160" text-anchor="middle" fill="#059669">had been</text>
