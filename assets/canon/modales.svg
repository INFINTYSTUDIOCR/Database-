<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Pronombre + Modal + Verbo">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="22" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="11" font-weight="bold">ESTRUCTURA</text>
  <text x="160" y="38" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="bold">PRONOMBRE + MODAL + VERBO</text>
  <rect x="10" y="48" width="92" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="68" text-anchor="middle" fill="#5B21B6" font-size="9" font-weight="bold">PRONOMBRE</text>
  <text x="56" y="82" text-anchor="middle" fill="#312e81" font-size="8">sujeto</text>
  <rect x="112" y="48" width="92" height="44" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="158" y="68" text-anchor="middle" fill="#047857" font-size="9" font-weight="bold">MODAL</text>
  <text x="158" y="82" text-anchor="middle" fill="#312e81" font-size="8">can should must...</text>
  <rect x="214" y="48" width="96" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="262" y="68" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="bold">VERBO</text>
  <text x="262" y="82" text-anchor="middle" fill="#312e81" font-size="8">base (sin to)</text>
  <text x="160" y="112" text-anchor="middle" fill="#312e81" font-size="9">can habilidad | could pasado/posib. | should consejo</text>
  <text x="160" y="128" text-anchor="middle" fill="#312e81" font-size="9">must obligacion | may/might posibilidad | will/would</text>
  <text x="160" y="148" text-anchor="middle" fill="#D97706" font-size="10" font-weight="bold">She can swim.  |  You should drink water.</text>
  <text x="160" y="168" text-anchor="middle" fill="#6d28d9" font-size="8">RECUERDA: despues del modal = verbo base (sin to)</text>
</svg>
