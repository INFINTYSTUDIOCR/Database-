<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Modales">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="28" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="13" font-weight="bold">MODALES</text>
  <text x="160" y="48" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="10">P + MODAL + V base + C</text>
  <rect x="24" y="62" width="272" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" fill="#312e81" font-size="11" font-weight="bold">can / could / should / must / may / might / will / would</text>
  <text x="160" y="106" text-anchor="middle" fill="#312e81" font-size="10">I can go.  |  She should study.</text>
  <text x="160" y="124" text-anchor="middle" fill="#312e81" font-size="10">Pregunta: Can you help?  (modal al frente)</text>
  <text x="160" y="142" text-anchor="middle" fill="#6d28d9" font-size="9">Negacion: cannot / can't + V base (sin to)</text>
  <text x="160" y="168" text-anchor="middle" fill="#7c3aed" font-size="9">No confundir con Metodo Moneda (inversion to be)</text>
</svg>
