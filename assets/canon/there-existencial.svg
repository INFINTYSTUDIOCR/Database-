<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="There is there are">
  <rect width="320" height="200" rx="12" fill="none"/>
  <text x="160" y="28" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="12" font-weight="bold">THERE + BE + C · el HAY español</text>
  <rect x="20" y="42" width="72" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="56" y="65" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">THERE</text>
  <text x="100" y="65" text-anchor="middle" fill="#6d28d9" font-size="16">+</text>
  <rect x="112" y="42" width="56" height="36" rx="8" fill="#fef3c7" stroke="#D97706" stroke-width="1"/><text x="140" y="65" text-anchor="middle" fill="#92400e" font-size="11" font-weight="bold">BE</text>
  <text x="176" y="65" text-anchor="middle" fill="#6d28d9" font-size="16">+</text>
  <rect x="188" y="42" width="112" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/><text x="244" y="65" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="bold">C</text>
  <text x="160" y="96" text-anchor="middle" fill="#312e81" font-size="10">hay un gato ’ there is a cat · hay gatos ’ there are cats</text>
  <rect x="16" y="108" width="88" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa"/><text x="60" y="128" text-anchor="middle" fill="#5B21B6" font-size="9">is / are</text>
  <rect x="116" y="108" width="88" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa"/><text x="160" y="128" text-anchor="middle" fill="#5B21B6" font-size="9">was / were</text>
  <rect x="216" y="108" width="88" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa"/><text x="260" y="128" text-anchor="middle" fill="#5B21B6" font-size="9">will be</text>
  <rect x="66" y="148" width="88" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa"/><text x="110" y="168" text-anchor="middle" fill="#5B21B6" font-size="9">would be</text>
  <rect x="166" y="148" width="88" height="32" rx="6" fill="#f5f3ff" stroke="#a78bfa"/><text x="210" y="168" text-anchor="middle" fill="#5B21B6" font-size="9">has/have been</text>
  <text x="160" y="192" text-anchor="middle" fill="#6d28d9" font-size="9">Pregunta (moneda): Is there&? · Are there&? · Will there be&?</text>
</svg>
