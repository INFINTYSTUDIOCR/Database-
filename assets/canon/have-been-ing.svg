<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Pronombre + Have + Been + Verbo ING">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="18" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="10" font-weight="bold">ESTRUCTURA</text>
  <text x="160" y="32" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="bold">PRONOMBRE + HAVE/HAS + BEEN + VERBO (ING)</text>
  <rect x="6" y="42" width="72" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="42" y="60" text-anchor="middle" fill="#5B21B6" font-size="8" font-weight="bold">PRONOMBRE</text>
  <text x="42" y="74" text-anchor="middle" fill="#312e81" font-size="7">I you he...</text>
  <rect x="84" y="42" width="72" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="120" y="60" text-anchor="middle" fill="#047857" font-size="8" font-weight="bold">HAVE/HAS</text>
  <text x="120" y="74" text-anchor="middle" fill="#312e81" font-size="7">auxiliar</text>
  <rect x="162" y="42" width="68" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="196" y="60" text-anchor="middle" fill="#1d4ed8" font-size="8" font-weight="bold">BEEN</text>
  <text x="196" y="74" text-anchor="middle" fill="#312e81" font-size="7">participio be</text>
  <rect x="236" y="42" width="78" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/>
  <text x="275" y="60" text-anchor="middle" fill="#be185d" font-size="8" font-weight="bold">VERBO ING</text>
  <text x="275" y="74" text-anchor="middle" fill="#312e81" font-size="7">accion en curso</text>
  <text x="160" y="100" text-anchor="middle" fill="#312e81" font-size="9">Empezo en el pasado y sigue / duracion (for / since)</text>
  <text x="160" y="118" text-anchor="middle" fill="#D97706" font-size="10" font-weight="bold">I have been studying for 2 hours.</text>
  <text x="160" y="136" text-anchor="middle" fill="#D97706" font-size="10">She has been working here since 2020.</text>
  <text x="160" y="158" text-anchor="middle" fill="#6d28d9" font-size="8">I/you/we/they = have been | he/she/it = has been</text>
  <text x="160" y="172" text-anchor="middle" fill="#7c3aed" font-size="7">No es PC (am/is/are+ing) ni PRP (have+PP)</text>
</svg>
