<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Have been + V-ing">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="26" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="12" font-weight="bold">PRESENTE PERFECTO CONTINUO</text>
  <text x="160" y="44" text-anchor="middle" fill="#6d28d9" font-size="10">P + have/has + been + V-ing + C</text>
  <rect x="20" y="56" width="280" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="78" text-anchor="middle" fill="#5B21B6" font-size="13" font-weight="bold">have / has + been + V-ing</text>
  <text x="160" y="96" text-anchor="middle" fill="#D97706" font-size="12">I have been working</text>
  <text x="160" y="128" text-anchor="middle" fill="#312e81" font-size="10">Accion que empezo en el pasado y sigue / duracion</text>
  <text x="160" y="148" text-anchor="middle" fill="#312e81" font-size="10">She has been studying all morning</text>
  <text x="160" y="168" text-anchor="middle" fill="#6d28d9" font-size="9">No es PRP (have + PP) ni PC (am/is/are + ing)</text>
</svg>
