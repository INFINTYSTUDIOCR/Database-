<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Gerundio despues de preposicion">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ebff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg2)" rx="16"/>
  <text x="480" y="56" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="800">GERUNDIO despues de PREPOSICION</text>
  <text x="480" y="90" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="16">NO es Presente Continuo - aca el -ING es el complemento de la prep</text>

  <rect x="80" y="130" width="240" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="175" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="700" font-family="Inter,sans-serif">PREP</text>
  <text x="200" y="210" text-anchor="middle" fill="#312e81" font-size="15" font-family="Inter,sans-serif">before | after | without</text>
  <text x="200" y="232" text-anchor="middle" fill="#312e81" font-size="14" font-family="Inter,sans-serif">by | instead of | good at</text>

  <text x="360" y="195" text-anchor="middle" fill="#6d28d9" font-size="36" font-weight="800">+</text>

  <rect x="420" y="130" width="240" height="110" rx="14" fill="#fef3c7" stroke="#D97706" stroke-width="2.5"/>
  <text x="540" y="175" text-anchor="middle" fill="#B45309" font-size="22" font-weight="700" font-family="Inter,sans-serif">V + ing</text>
  <text x="540" y="210" text-anchor="middle" fill="#92400E" font-size="15" font-family="Inter,sans-serif">leaving | going | working</text>
  <text x="540" y="232" text-anchor="middle" fill="#92400E" font-size="14" font-family="Inter,sans-serif">el verbo se vuelve -ING</text>

  <text x="700" y="195" text-anchor="middle" fill="#6d28d9" font-size="36" font-weight="800">+</text>

  <rect x="740" y="130" width="140" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="810" y="185" text-anchor="middle" fill="#5B21B6" font-size="20" font-weight="700" font-family="Inter,sans-serif">C</text>
  <text x="810" y="215" text-anchor="middle" fill="#312e81" font-size="13" font-family="Inter,sans-serif">resto</text>

  <rect x="120" y="280" width="720" height="50" rx="10" fill="rgba(91,33,182,0.08)" stroke="rgba(91,33,182,0.25)"/>
  <text x="480" y="314" text-anchor="middle" fill="#5B21B6" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="700">PREP + V-ing (+ C)</text>

  <text x="480" y="380" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="15">Ejemplos</text>
  <text x="480" y="420" text-anchor="middle" fill="#312e81" font-family="ui-monospace,Consolas,monospace" font-size="24" font-weight="700">Before leaving, call me.</text>
  <text x="480" y="460" text-anchor="middle" fill="#312e81" font-family="ui-monospace,Consolas,monospace" font-size="24" font-weight="700">She left without saying goodbye.</text>
  <text x="480" y="510" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="14">Despues de prep en ingles: verbo en -ING (no infinitivo suelto)</text>
</svg>
