    <text x="360" y="188" text-anchor="middle" fill="#059669" font-weight="700">His</text>
    <text x="470" y="188" text-anchor="middle" fill="#db2777" font-weight="700">His</text>
    <text x="600" y="188" text-anchor="middle" fill="#7c3aed" font-weight="700">Himself</text>

