  <text x="360" y="83" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Pos.Adj</text>
  <text x="470" y="83" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Pos.Pron</text>
  <text x="600" y="83" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Reflexivo</text>
  <!-- rows -->
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12">
