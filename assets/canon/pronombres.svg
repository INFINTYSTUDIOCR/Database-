<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Los 5 tipos de pronombres  tabla completa">
  <rect width="720" height="420" rx="14" fill="#f8f5ff"/>
  <text x="360" y="28" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">LOS 5 TIPOS DE PRONOMBRES</text>
  <text x="360" y="48" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="11">Misma lógica ES ” EN  solo cambia la forma</text>
  <!-- header -->
