    <text x="600" y="324" text-anchor="middle" fill="#7c3aed" font-weight="700">Yourselves</text>

    <rect x="16" y="336" width="688" height="34" fill="#f8f5ff"/>
    <text x="70" y="358" text-anchor="middle" fill="#312e81">Ellos</text>
