  <text x="360" y="396" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="600">Sujeto hace · Objeto recibe · Pos.Adj acompaña · Pos.Pron reemplaza · Reflexivo vuelve al sujeto</text>
  <text x="360" y="412" text-anchor="middle" fill="#6d28d9" font-size="10">You e It no cambian sujeto”objeto · His igual en Pos.Adj y Pos.Pron</text>
