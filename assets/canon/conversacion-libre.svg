<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Conversación libre. Ciclo: tema, habla, una pieza, de vuelta al hilo.">
  <rect width="720" height="400" rx="12" fill="none"/>
  <text x="360" y="26" text-anchor="middle" fill="#7B4DFF" font-family="Inter,sans-serif" font-size="18" font-weight="bold">CONVERSACIÓN LIBRE</text>
  <text x="360" y="46" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="12">El tema es real. El inglés es el vehículo.</text>

  <rect x="28" y="64" width="140" height="70" rx="10" fill="rgba(123,77,255,0.16)" stroke="#9B74FF" stroke-width="1.5"/>
  <text x="98" y="92" text-anchor="middle" fill="#7B4DFF" font-family="Inter,sans-serif" font-size="12" font-weight="bold">1 · TEMA REAL</text>
  <text x="98" y="112" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="11">familia, salud, plata</text>

  <polygon points="192,99 178,93 178,105" fill="#7B4DFF"/>

  <rect x="198" y="64" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="268" y="92" text-anchor="middle" fill="#1d4ed8" font-family="Inter,sans-serif" font-size="12" font-weight="bold">2 · HABLA EN</text>
  <text x="268" y="112" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="11">el alumno cuenta</text>

  <polygon points="362,99 348,93 348,105" fill="#7B4DFF"/>

  <rect x="368" y="64" width="140" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="438" y="92" text-anchor="middle" fill="#92400E" font-family="Inter,sans-serif" font-size="12" font-weight="bold">3 · UNA PIEZA</text>
  <text x="438" y="112" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="11">una corrección</text>

  <polygon points="532,99 518,93 518,105" fill="#7B4DFF"/>

  <rect x="538" y="64" width="154" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="615" y="92" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12" font-weight="bold">4 · AL HILO</text>
  <text x="615" y="112" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="11">sigue el tema</text>

  <path d="M615 134 V162 H98 V140" fill="none" stroke="#7B4DFF" stroke-width="1.5"/>
  <polygon points="92,140 104,140 98,128" fill="#7B4DFF"/>
  <text x="360" y="176" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="12" font-weight="bold">de vuelta al tema</text>

  <rect x="24" y="196" width="328" height="56" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="188" y="218" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="13" font-weight="bold">even = ni siquiera</text>
  <text x="188" y="236" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12">It doesn't even exist.</text>

  <rect x="368" y="196" width="328" height="56" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="532" y="218" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="13" font-weight="bold">if she were = hipotético</text>
  <text x="532" y="236" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12">If she were a younger dog.</text>

  <rect x="24" y="262" width="328" height="56" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="188" y="284" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="13" font-weight="bold">either way = igual</text>
  <text x="188" y="302" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12">Either way, the answer is the same.</text>

  <rect x="368" y="262" width="328" height="56" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="532" y="284" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="13" font-weight="bold">besides = además</text>
  <text x="532" y="302" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12">Besides, we don't have the money.</text>

  <rect x="24" y="334" width="672" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="361" text-anchor="middle" fill="#92400E" font-family="Inter,sans-serif" font-size="14" font-weight="bold">Empatía + precisión. Una pieza. Después, de vuelta al tema.</text>
</svg>
