<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Have Has Had">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="20" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="11" font-weight="bold">ESTRUCTURA</text>
  <text x="160" y="36" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="bold">PRONOMBRE + HAVE/HAS/HAD + PARTICIPIO</text>
  <rect x="16" y="48" width="140" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="86" y="70" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">HAVE / HAS</text>
  <text x="86" y="88" text-anchor="middle" fill="#312e81" font-size="9">Presente perfecto</text>
  <text x="86" y="106" text-anchor="middle" fill="#D97706" font-size="10">I have worked</text>
  <rect x="164" y="48" width="140" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="234" y="70" text-anchor="middle" fill="#5B21B6" font-size="11" font-weight="bold">HAD</text>
  <text x="234" y="88" text-anchor="middle" fill="#312e81" font-size="9">Pasado perfecto</text>
  <text x="234" y="106" text-anchor="middle" fill="#D97706" font-size="10">I had worked</text>
  <text x="160" y="140" text-anchor="middle" fill="#312e81" font-size="9">I/you/we/they have | he/she/it has | todos had</text>
  <text x="160" y="160" text-anchor="middle" fill="#6d28d9" font-size="8">RECUERDA: auxiliar + PARTICIPIO (3a columna)</text>
</svg>
