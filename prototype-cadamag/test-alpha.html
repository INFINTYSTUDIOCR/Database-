<!DOCTYPE html>
<html lang="es">
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#080B0F">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba Video Transparente Infinity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Fondo fuerte para comprobar la transparencia */
      background:
        radial-gradient(
          circle at 30% 40%,
          #7137ff 0%,
          #321279 38%,
          #121020 65%,
          #ff8500 140%
        );

      font-family: Arial, sans-serif;
    }

    .test-container {
      position: relative;
      width: min(850px, 90vw);
      min-height: 650px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,.25);
      border-radius: 24px;

      overflow: hidden;
    }

    .label {
      position: absolute;
      top: 20px;
      left: 20px;

      padding: 10px 16px;

      color: white;
      background: rgba(0,0,0,.35);

      border-radius: 999px;

      font-size: 14px;
      z-index: 10;
    }

    video {
      display: block;

      width: auto;
      max-width: 100%;

      height: 80vh;
      max-height: 750px;

      object-fit: contain;

      /* IMPORTANTE: ningún fondo */
      background: transparent;
    }
  </style>
</head>

<body>

  <div class="test-container">

    <div class="label">
      TEST DE TRANSPARENCIA
    </div>

    <video
      autoplay
      muted
      loop
      playsinline
      controls
    >
      <source
        src="assets/video/infinity-welcome-final.webm"
        type="video/webm"
      >

      Tu navegador no puede reproducir este video.
    </video>

  </div>

</body>
</html>
