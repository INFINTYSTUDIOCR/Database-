<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Infinity Simulation · Corporate Banking CRM</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f4f1eb;overflow:hidden;font-family:Inter,Arial,sans-serif}
    iframe{width:100%;height:100%;border:0;display:block}
    .gate{min-height:100%;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:radial-gradient(circle at top,#ede9fe,#f8fafc 55%)}
    .card{width:min(430px,100%);box-sizing:border-box;padding:28px;background:#fff;border:1px solid #ddd6fe;border-radius:18px;box-shadow:0 24px 70px rgba(46,16,101,.16);text-align:center}
    .brand{font-weight:900;color:#5b21b6;letter-spacing:.02em;margin-bottom:16px}
    .card h1{font-size:22px;color:#1e1b4b;margin:0 0 8px}
    .card p{color:#64748b;font-size:13px;line-height:1.55;margin:0}
    .msg{font:600 12px Inter,Arial,sans-serif;color:#b42318;min-height:18px;margin-top:14px}
  </style>
</head>
<body>
  <div class="gate" id="login-gate">
    <div class="card">
      <div class="brand">∞ INFINITY SIMULATION</div>
      <h1>Opening your desk…</h1>
      <p>Using your Training Book session. No extra codes.</p>
      <div class="msg" id="sim-msg"></div>
    </div>
  </div>
  <iframe id="simulation-frame" title="Infinity Corporate Banking Simulation" allow="microphone" hidden></iframe>
  <script src="infinity-auth.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var product = params.get('product') === 'kamuk' ? 'kamuk' : 'infinity';
      var gate = document.getElementById('login-gate');
      var frame = document.getElementById('simulation-frame');
      var msg = document.getElementById('sim-msg');

      function openDesk() {
        gate.hidden = true;
        frame.hidden = false;
        frame.src = 'kamuk/kamuk-holdings-crm.html?product=' + encodeURIComponent(product);
      }

      function fail(text) {
        msg.textContent = text || 'Open this page from your Training Book while logged in.';
      }

      if (typeof getAuthToken !== 'function' || !getAuthToken()) {
        fail('No Training Book session found. Log in to the portal first.');
        return;
      }

      fetch(INFINITY_API + '/auth/verify', { headers: { Authorization: 'Bearer ' + getAuthToken() } })
        .then(function (response) {
          if (!response.ok) throw new Error('expired');
          return response.json();
        })
        .then(function (data) {
          if (data.role !== 'student') throw new Error('role');
          var sid = String(data.studentId || '');
          var matches = product === 'kamuk' ? sid.indexOf('KAM-') === 0 : sid.indexOf('KAM-') !== 0;
          if (!matches) throw new Error('product');
          openDesk();
        })
        .catch(function () {
          fail('Session expired. Return to the Training Book and open Simulation again.');
        });
    })();
  </script>
</body>
</html>
