<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinity Arcade — demo local</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07061a;font-family:system-ui,Segoe UI,sans-serif;color:#e9d5ff;overflow:hidden}
@keyframes cabIn{0%{opacity:0;transform:translateY(36px) scale(.86)}70%{opacity:1;transform:translateY(-6px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes cabGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(167,139,250,.4))}50%{filter:drop-shadow(0 0 28px rgba(34,211,238,.55))}}
@keyframes bootBlink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(-120%)}100%{transform:translateY(220%)}}
@keyframes ringPulse{0%{transform:scale(.7);opacity:0}40%{opacity:1}100%{transform:scale(1.2);opacity:0}}
@keyframes menuIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}
@keyframes zoomOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes monitorIn{0%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:none}}
@keyframes btnPop{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}

.view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.view-cabinet{background:radial-gradient(ellipse at center,#1a0a3a 0%,#07061a 72%);padding:12px}
.view-cabinet.is-zoom{animation:zoomOut .45s ease-in forwards;pointer-events:none}
.bar{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:8}
.bar span{font-size:11px;letter-spacing:.16em;font-weight:800;color:#c4b5fd}
.bar button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#e9d5ff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}

.cab{position:relative;display:inline-block;line-height:0;cursor:pointer;max-width:96vw}
.cab.is-enter{animation:cabIn .9s cubic-bezier(.2,.8,.2,1) both,cabGlow 3s ease-in-out .9s infinite}
.cab img{display:block;max-height:min(88vh,860px);width:auto;max-width:96vw;pointer-events:none;user-select:none}
.cab:focus{outline:none}
.hint-tap{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;color:#a5f3fc;text-shadow:0 0 12px rgba(34,211,238,.6);z-index:9;pointer-events:none;animation:bootBlink 1.4s ease-in-out infinite}

/* Menú mini DENTRO del monitor cyan */
.scr{position:absolute;overflow:hidden;border-radius:10px;opacity:0;z-index:4;box-sizing:border-box;
  background:linear-gradient(180deg,#0a3a4a,#062028);
  box-shadow:inset 0 0 14px rgba(255,255,255,.18),0 0 0 2px rgba(125,211,252,.35)}
.scr.is-on{opacity:1;animation:menuIn .4s ease both}
.scr:before{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);opacity:.4;pointer-events:none;animation:scan 2.6s linear infinite;z-index:0}
.scr-in{position:relative;z-index:1;width:100%;height:100%;padding:4% 5%;display:flex;flex-direction:column;justify-content:center;gap:3%;overflow:hidden}
.scr-title{font-size:clamp(6px,1.6vw,9px);font-weight:900;letter-spacing:.12em;color:#7dd3fc;text-align:center;flex:0 0 auto}
.scr-grid{display:grid;grid-template-columns:1fr 1fr;gap:3%;flex:1 1 auto;align-content:center;min-height:0}
.scr-grid span{display:flex;align-items:center;justify-content:flex-start;gap:4px;padding:6% 5%;border-radius:8px;background:rgba(8,12,24,.92);color:#f8fafc;font-size:clamp(5px,1.35vw,8px);font-weight:800;line-height:1.05;border:1px solid rgba(255,255,255,.18);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.boot{font-size:clamp(7px,1.8vw,11px);font-weight:900;letter-spacing:.14em;color:#e0f2fe;text-align:center;animation:bootBlink 1s ease-in-out infinite}

.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:5;opacity:0}
.ring-y{border:4px solid #FACC15;box-shadow:0 0 20px rgba(250,204,21,.5)}
.ring-g{border:4px solid #4ADE80;box-shadow:0 0 20px rgba(74,222,128,.45)}
.ring.on{animation:ringPulse 1.1s ease-out forwards}

/* ═══ PANTALLA 2: solo menú fullscreen (foto 2) ═══ */
.view-monitor{display:none;background:radial-gradient(ellipse at center,#1e1b4b 0%,#07061a 75%);padding:max(12px,env(safe-area-inset-top)) 16px 20px;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.view-monitor.is-open{display:flex}
.view-monitor.is-enter .frame{animation:monitorIn .5s cubic-bezier(.2,.8,.2,1) both}
.frame{
  width:min(420px,92vw);height:min(560px,78vh);
  border-radius:28px;padding:14px;
  background:linear-gradient(160deg,#67e8f9 0%,#a78bfa 45%,#c084fc 100%);
  box-shadow:0 0 0 3px rgba(103,232,249,.35),0 0 40px rgba(103,232,249,.35),0 20px 50px rgba(0,0,0,.45);
}
.panel{
  width:100%;height:100%;border-radius:18px;
  background:linear-gradient(180deg,#0c3d4a,#061820 55%,#041018);
  box-shadow:inset 0 0 30px rgba(0,0,0,.35);
  padding:18px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;
}
.panel h1{margin:0;text-align:center;font-size:13px;letter-spacing:.18em;color:#7dd3fc;font-weight:900}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center}
.grid button{
  display:flex;align-items:center;gap:8px;text-align:left;
  border:1px solid rgba(255,255,255,.22);border-radius:14px;
  background:rgba(8,12,24,.94);color:#fff;font-weight:800;font-size:13px;
  padding:14px 12px;cursor:pointer;opacity:0;animation:btnPop .35s ease forwards;
  box-shadow:0 3px 0 rgba(0,0,0,.25);
}
.grid button:nth-child(1){animation-delay:.05s}.grid button:nth-child(2){animation-delay:.1s}
.grid button:nth-child(3){animation-delay:.15s}.grid button:nth-child(4){animation-delay:.2s}
.grid button:nth-child(5){animation-delay:.25s}.grid button:nth-child(6){animation-delay:.3s}
.grid button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.grid .ico{font-size:16px;flex:0 0 auto}
.extras{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.extras button,.back-btn{
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#e9d5ff;
  border-radius:12px;padding:10px 14px;font-weight:800;font-size:12px;cursor:pointer;
}
.pick-msg{font-size:12px;color:#a5f3fc;text-align:center;min-height:18px}
</style>
</head>
<body>

<!-- VISTA 1: máquina arcade animada -->
<div class="view view-cabinet" id="view1">
  <div class="bar">
    <span>INFINITY ARCADE</span>
    <button type="button" id="btn-replay">↻ Replay</button>
  </div>
  <div class="cab" id="cab" role="button" tabindex="0" aria-label="Abrir menú de juegos">
    <img src="assets/infinity-arcade-cabinet.png" alt="Infinity Arcade" draggable="false">
    <div class="ring ring-y" id="ringY"></div>
    <div class="ring ring-g" id="ringG"></div>
    <div class="scr" id="scr"><div class="scr-in" id="scrIn"><div class="boot">INSERT COIN…</div></div></div>
  </div>
  <div class="hint-tap" id="hintTap" hidden>👆 Tocá la máquina → menú pantalla completa</div>
</div>

<!-- VISTA 2: solo pantalla / menú (foto 2) -->
<div class="view view-monitor" id="view2">
  <div class="bar">
    <span>LANGUAGE ARCADE</span>
    <button type="button" class="back-btn" id="btn-back">← Máquina</button>
  </div>
  <div class="frame">
    <div class="panel">
      <h1>LANGUAGE ARCADE</h1>
      <div class="grid" id="modeGrid"></div>
      <div class="extras">
        <button type="button" data-pick="Rapid Drill">🔥 Rapid Drill</button>
        <button type="button" data-pick="Challenge Drill">⚡ Challenge Drill</button>
      </div>
    </div>
  </div>
  <div class="pick-msg" id="pickMsg"></div>
</div>

<script>
var MODES = [
  { icon:'🎯', title:'Verb Hunt' },
  { icon:'🧱', title:'Structure Creator' },
  { icon:'◎', title:'Preposition Challenge' },
  { icon:'〰', title:'Linker Quest' },
  { icon:'✏️', title:'Phrasal Master' },
  { icon:'🔥', title:'Frenzy Mode' }
];

/* Coordenadas del monitor cyan en el PNG (medidas reales) */
var SCR = { l: 0.220, t: 0.320, w: 0.480, h: 0.210 };
var MAR = { l: 0.220, t: 0.082, w: 0.560, h: 0.080 };

function layout(){
  var cab = document.getElementById('cab');
  var img = cab.querySelector('img');
  var scr = document.getElementById('scr');
  var iw = img.clientWidth, ih = img.clientHeight;
  if(iw < 40) return;
  var ol = img.offsetLeft || 0, ot = img.offsetTop || 0;
  scr.style.left = Math.round(ol + SCR.l * iw) + 'px';
  scr.style.top = Math.round(ot + SCR.t * ih) + 'px';
  scr.style.width = Math.round(SCR.w * iw) + 'px';
  scr.style.height = Math.round(SCR.h * ih) + 'px';

  var ry = document.getElementById('ringY');
  var mx = ol + (MAR.l + MAR.w/2) * iw;
  var my = ot + (MAR.t + MAR.h/2) * ih;
  var ms = Math.max(MAR.w*iw, MAR.h*ih) * 1.45;
  ry.style.left = Math.round(mx - ms/2) + 'px';
  ry.style.top = Math.round(my - ms/2) + 'px';
  ry.style.width = ry.style.height = Math.round(ms) + 'px';

  var rg = document.getElementById('ringG');
  var sx = ol + (SCR.l + SCR.w/2) * iw;
  var sy = ot + (SCR.t + SCR.h/2) * ih;
  var ss = Math.max(SCR.w*iw, SCR.h*ih) * 1.12;
  rg.style.left = Math.round(sx - ss/2) + 'px';
  rg.style.top = Math.round(sy - ss/2) + 'px';
  rg.style.width = rg.style.height = Math.round(ss) + 'px';
}

function previewMenu(){
  var el = document.getElementById('scrIn');
  el.innerHTML =
    '<div class="scr-title">LANGUAGE ARCADE</div>'
    + '<div class="scr-grid">'
    + MODES.map(function(m){ return '<span>'+m.icon+' '+m.title+'</span>'; }).join('')
    + '</div>';
  document.getElementById('scr').classList.add('is-on');
  document.getElementById('hintTap').hidden = false;
  layout();
}

function playIntro(){
  clearTimeout(window._a); clearTimeout(window._b); clearTimeout(window._c);
  var cab = document.getElementById('cab');
  var scr = document.getElementById('scr');
  var ry = document.getElementById('ringY');
  var rg = document.getElementById('ringG');
  document.getElementById('hintTap').hidden = true;
  cab.classList.remove('is-enter'); void cab.offsetWidth; cab.classList.add('is-enter');
  scr.classList.remove('is-on');
  document.getElementById('scrIn').innerHTML = '<div class="boot">INSERT COIN…</div>';
  ry.classList.remove('on'); rg.classList.remove('on');
  layout();
  window._a = setTimeout(function(){ layout(); ry.classList.remove('on'); void ry.offsetWidth; ry.classList.add('on'); }, 500);
  window._b = setTimeout(function(){ layout(); rg.classList.remove('on'); void rg.offsetWidth; rg.classList.add('on'); scr.classList.add('is-on'); }, 1100);
  window._c = setTimeout(previewMenu, 1600);
}

function openMonitor(){
  var v1 = document.getElementById('view1');
  var v2 = document.getElementById('view2');
  v1.classList.add('is-zoom');
  setTimeout(function(){
    v1.style.display = 'none';
    v1.classList.remove('is-zoom');
    v2.classList.add('is-open','is-enter');
  }, 420);
}

function backToCabinet(){
  var v1 = document.getElementById('view1');
  var v2 = document.getElementById('view2');
  v2.classList.remove('is-open','is-enter');
  v1.style.display = 'flex';
  document.getElementById('pickMsg').textContent = '';
  playIntro();
}

function buildGrid(){
  var g = document.getElementById('modeGrid');
  g.innerHTML = MODES.map(function(m){
    return '<button type="button" data-pick="'+m.title+'"><span class="ico">'+m.icon+'</span>'+m.title+'</button>';
  }).join('');
}

document.getElementById('cab').onclick = openMonitor;
document.getElementById('cab').onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openMonitor(); } };
document.getElementById('btn-back').onclick = backToCabinet;
document.getElementById('btn-replay').onclick = function(e){ e.stopPropagation(); playIntro(); };
document.getElementById('view2').addEventListener('click', function(e){
  var b = e.target.closest('[data-pick]');
  if(!b) return;
  document.getElementById('pickMsg').textContent = 'Elegiste: ' + b.getAttribute('data-pick');
});

buildGrid();
var img = document.querySelector('#cab img');
if(img.complete) layout(); else img.addEventListener('load', layout, { once:true });
window.addEventListener('resize', layout);
setTimeout(layout, 50); setTimeout(layout, 200);
playIntro();
</script>
</body>
</html>
