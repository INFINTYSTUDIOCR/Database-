  <text x="534" y="98" text-anchor="middle" fill="#831843" font-size="11">hipotético · podría pasar</text>
  <text x="534" y="118" text-anchor="middle" fill="#059669" font-size="12">Correría ’ I would run</text>
  <text x="534" y="138" text-anchor="middle" fill="#831843" font-size="11">Iría · Comería · Trabajaría</text>
  <text x="534" y="158" text-anchor="middle" fill="#6b7280" font-size="10">WOULD + verbo · sin TO · nadie cambia</text>

  <rect x="16" y="186" width="688" height="26" rx="6" fill="#0369a1"/>
  <text x="120" y="204" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">MODAL</text>
  <text x="320" y="204" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">ESPAÑOL</text>
  <text x="540" y="204" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">TIPO</text>

  <g font-family="Inter,Segoe UI,sans-serif" font-size="11">
    <rect x="16" y="216" width="688" height="20" fill="#e0f2fe"/><text x="120" y="230" text-anchor="middle" fill="#0c4a6e">will</text><text x="320" y="230" text-anchor="middle" fill="#0284c7" font-weight="700">RÉ</text><text x="540" y="230" text-anchor="middle" fill="#059669">futuro real</text>
    <rect x="16" y="236" width="688" height="20" fill="#f0f9ff"/><text x="120" y="250" text-anchor="middle" fill="#0c4a6e">would</text><text x="320" y="250" text-anchor="middle" fill="#db2777" font-weight="700">RÍA</text><text x="540" y="250" text-anchor="middle" fill="#059669">hipotético / deseo</text>
    <rect x="16" y="256" width="688" height="20" fill="#e0f2fe"/><text x="120" y="270" text-anchor="middle" fill="#0c4a6e">can / could</text><text x="320" y="270" text-anchor="middle" fill="#0c4a6e">puedo / podía·ría</text><text x="540" y="270" text-anchor="middle" fill="#059669">capacidad</text>
