    <rect x="16" y="296" width="688" height="20" fill="#e0f2fe"/><text x="120" y="310" text-anchor="middle" fill="#0c4a6e">may / might</text><text x="320" y="310" text-anchor="middle" fill="#0c4a6e">puede que / podría</text><text x="540" y="310" text-anchor="middle" fill="#059669">posibilidad</text>
