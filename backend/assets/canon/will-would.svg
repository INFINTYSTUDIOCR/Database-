  <text x="360" y="42" text-anchor="middle" fill="#0284c7" font-family="Inter,Segoe UI,sans-serif" font-size="10">Real ’ WILL · Hipotético ’ WOULD · Modal + verbo sin TO · BY + will have + PP</text>

  <rect x="16" y="54" width="340" height="120" rx="8" fill="#dbeafe" stroke="#0284c7"/>
  <text x="186" y="78" text-anchor="middle" fill="#0284c7" font-size="13" font-weight="700">WILL  RÉ</text>
  <text x="186" y="98" text-anchor="middle" fill="#0c4a6e" font-size="11">futuro real · va a pasar</text>
  <text x="186" y="118" text-anchor="middle" fill="#059669" font-size="12">Correré ’ I will run</text>
  <text x="186" y="138" text-anchor="middle" fill="#0c4a6e" font-size="11">Iré · Comeré · Trabajaré</text>
  <text x="186" y="158" text-anchor="middle" fill="#6b7280" font-size="10">WILL + verbo · sin TO · nadie cambia</text>

  <rect x="364" y="54" width="340" height="120" rx="8" fill="#fce7f3" stroke="#db2777"/>
