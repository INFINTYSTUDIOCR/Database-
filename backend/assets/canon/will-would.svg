<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Clase 010  WILL RÉ · WOULD RÍA · Futuro perfecto">
  <rect width="720" height="480" rx="14" fill="#f0f9ff"/>
