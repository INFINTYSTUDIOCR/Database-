  <rect x="16" y="328" width="688" height="80" rx="8" fill="#fef3c7" stroke="#D97706"/>
  <text x="360" y="352" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">FUTURO PERFECTO = WILL + HAVE + PARTICIPIO</text>
  <text x="360" y="372" text-anchor="middle" fill="#0c4a6e" font-size="11">By Monday  I will have finished · Habré terminado</text>
