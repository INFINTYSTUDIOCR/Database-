<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Pronombre + To Be + Verbo ING">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="20" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="11" font-weight="bold">ESTRUCTURA</text>
  <text x="160" y="36" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="bold">PRONOMBRE + TO BE + VERBO (ING)</text>
  <rect x="10" y="46" width="92" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="66" text-anchor="middle" fill="#5B21B6" font-size="9" font-weight="bold">PRONOMBRE</text>
  <text x="56" y="80" text-anchor="middle" fill="#312e81" font-size="8">sujeto</text>
  <rect x="112" y="46" width="92" height="44" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="158" y="66" text-anchor="middle" fill="#047857" font-size="9" font-weight="bold">TO BE</text>
  <text x="158" y="80" text-anchor="middle" fill="#312e81" font-size="8">am / is / are</text>
  <rect x="214" y="46" width="96" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="262" y="66" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="bold">VERBO ING</text>
  <text x="262" y="80" text-anchor="middle" fill="#312e81" font-size="8">accion ahora</text>
  <text x="160" y="108" text-anchor="middle" fill="#312e81" font-size="9">I am | he/she/it is | we/you/they are</text>
  <text x="160" y="126" text-anchor="middle" fill="#D97706" font-size="10" font-weight="bold">I am studying English now.</text>
  <text x="160" y="144" text-anchor="middle" fill="#D97706" font-size="10">She is cooking dinner.</text>
  <text x="160" y="166" text-anchor="middle" fill="#6d28d9" font-size="8">RECUERDA: despues del pronombre = TO BE + ING</text>
</svg>
