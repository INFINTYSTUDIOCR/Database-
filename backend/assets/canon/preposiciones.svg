<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Clase 011 — Tres círculos IN ON AT">
  <rect width="720" height="480" rx="14" fill="#f8f5ff"/>
  <text x="360" y="24" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">CLASE 011 — IN · ON · AT · TRES CÍRCULOS</text>
  <text x="360" y="42" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="10">EN español = uno · inglés = tres · espacio grande / superficie / punto exacto</text>

  <!-- Three sized circles: IN large, ON medium, AT point -->
  <circle cx="180" cy="175" r="88" fill="#ede9fe" stroke="#5B21B6" stroke-width="3"/>
  <circle cx="180" cy="175" r="52" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="180" cy="175" r="10" fill="#5B21B6"/>
  <text x="180" y="112" text-anchor="middle" fill="#5B21B6" font-size="16" font-weight="700">IN</text>
  <text x="180" y="168" text-anchor="middle" fill="#6d28d9" font-size="13" font-weight="700">ON</text>
  <text x="180" y="206" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">AT</text>
  <text x="180" y="288" text-anchor="middle" fill="#312e81" font-size="11">IN grande · ON mediano · AT punto</text>
  <text x="180" y="306" text-anchor="middle" fill="#6b7280" font-size="10">adentro · encima · exactamente ahí</text>

  <!-- Place / Time hint panel -->
  <rect x="320" y="64" width="380" height="230" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="510" y="88" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="700">LUGAR · TIEMPO</text>

  <rect x="336" y="104" width="110" height="78" rx="8" fill="#f8f5ff" stroke="#5B21B6"/>
  <text x="391" y="126" text-anchor="middle" fill="#5B21B6" font-size="14" font-weight="700">IN</text>
  <text x="391" y="146" text-anchor="middle" fill="#312e81" font-size="10">espacio / período</text>
  <text x="391" y="164" text-anchor="middle" fill="#059669" font-size="9">house · January</text>

  <rect x="455" y="104" width="110" height="78" rx="8" fill="#f8f5ff" stroke="#7c3aed"/>
  <text x="510" y="126" text-anchor="middle" fill="#7c3aed" font-size="14" font-weight="700">ON</text>
  <text x="510" y="146" text-anchor="middle" fill="#312e81" font-size="10">superficie / día</text>
  <text x="510" y="164" text-anchor="middle" fill="#059669" font-size="9">table · Monday</text>

  <rect x="574" y="104" width="110" height="78" rx="8" fill="#f8f5ff" stroke="#a78bfa"/>
  <text x="629" y="126" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="700">AT</text>
  <text x="629" y="146" text-anchor="middle" fill="#312e81" font-size="10">punto / hora</text>
  <text x="629" y="164" text-anchor="middle" fill="#059669" font-size="9">door · 7pm</text>

  <text x="510" y="210" text-anchor="middle" fill="#312e81" font-size="11">IN the morning · ON Monday · AT 7pm</text>
  <text x="510" y="232" text-anchor="middle" fill="#312e81" font-size="11">IN the office · ON the wall · AT home</text>
  <text x="510" y="258" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="600">SINCE / FOR · INTO / IN · LIKE / AS</text>
  <text x="510" y="276" text-anchor="middle" fill="#6b7280" font-size="9">punto vs duración · movimiento vs estado · comparación vs rol</text>

  <rect x="16" y="328" width="688" height="80" rx="8" fill="#fef3c7" stroke="#D97706"/>
  <text x="360" y="356" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">ANTES DE ELEGIR: ¿espacio grande, superficie o punto exacto?</text>
  <text x="360" y="378" text-anchor="middle" fill="#0c4a6e" font-size="11">IN = adentro · ON = encima (contacto) · AT = exactamente ahí</text>
  <text x="360" y="396" text-anchor="middle" fill="#6b7280" font-size="10">Español EN hace los tres · inglés los separa · patrón antes que lista</text>

  <text x="360" y="440" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="600">Módulo 7 / Clase 011 — preposiciones íntegras</text>
  <text x="360" y="460" text-anchor="middle" fill="#6d28d9" font-size="10">80% lo resuelven los tres círculos · el resto por función</text>
</svg>
