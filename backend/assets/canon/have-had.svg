<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Have Has Had">
  <rect width="320" height="180" rx="12" fill="none"/>
  <text x="160" y="26" text-anchor="middle" fill="#5B21B6" font-family="Inter,sans-serif" font-size="13" font-weight="bold">HAVE / HAS / HAD</text>
  <text x="160" y="44" text-anchor="middle" fill="#6d28d9" font-size="9">Auxiliar de perfecto + participio (PP)</text>
  <rect x="16" y="54" width="140" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="86" y="76" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">HAVE / HAS</text>
  <text x="86" y="94" text-anchor="middle" fill="#312e81" font-size="10">Presente perfecto</text>
  <text x="86" y="110" text-anchor="middle" fill="#D97706" font-size="10">I have worked</text>
  <rect x="164" y="54" width="140" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="234" y="76" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="bold">HAD</text>
  <text x="234" y="94" text-anchor="middle" fill="#312e81" font-size="10">Pasado perfecto</text>
  <text x="234" y="110" text-anchor="middle" fill="#D97706" font-size="10">I had worked</text>
  <text x="160" y="144" text-anchor="middle" fill="#312e81" font-size="10">Formula: P + have/has/had + PP + C</text>
  <text x="160" y="164" text-anchor="middle" fill="#6d28d9" font-size="9">She has gone  |  They had finished</text>
</svg>
