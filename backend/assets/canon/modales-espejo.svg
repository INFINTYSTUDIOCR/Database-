<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Dos géneros de modales. Espejo: izquierda pregunta, derecha afirmación.">
  <rect width="720" height="360" rx="12" fill="none"/>
  <text x="360" y="28" text-anchor="middle" fill="#7B4DFF" font-family="Inter,sans-serif" font-size="18" font-weight="bold">DOS GÉNEROS · ESPEJO</text>

  <rect x="24" y="42" width="328" height="52" rx="8" fill="rgba(123,77,255,0.16)" stroke="#9B74FF" stroke-width="1.5"/>
  <text x="188" y="62" text-anchor="middle" fill="#7B4DFF" font-family="Inter,sans-serif" font-size="11" font-weight="bold">PEDACITOS</text>
  <text x="188" y="82" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="14">will = ré · would = ría</text>

  <rect x="368" y="42" width="328" height="52" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="532" y="62" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="11" font-weight="bold">PALABRAS COMPLETAS</text>
  <text x="532" y="82" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="14">should · could · must · may · might</text>

  <rect x="24" y="110" width="300" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="174" y="136" text-anchor="middle" fill="#1d4ed8" font-family="Inter,sans-serif" font-size="12" font-weight="bold">IZQUIERDA · PREGUNTA</text>
  <text x="174" y="176" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="22" font-weight="bold">Should she go?</text>

  <line x1="360" y1="128" x2="360" y2="204" stroke="#7B4DFF" stroke-width="2"/>

  <rect x="396" y="110" width="300" height="112" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="546" y="136" text-anchor="middle" fill="#047857" font-family="Inter,sans-serif" font-size="12" font-weight="bold">DERECHA · AFIRMACIÓN</text>
  <text x="546" y="176" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="22" font-weight="bold">She should go.</text>

  <rect x="24" y="238" width="672" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="263" text-anchor="middle" fill="#92400E" font-family="Inter,sans-serif" font-size="14" font-weight="bold">MODAL + VERBO BASE · sin TO · will go · should go · must go</text>

  <text x="360" y="302" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="13" font-weight="bold">even + NOT = ni siquiera · I shouldn't even go.</text>
  <text x="360" y="324" text-anchor="middle" fill="#312e81" font-family="Inter,sans-serif" font-size="13">HAVE solo con participio: should have gone.</text>
  <text x="360" y="348" text-anchor="middle" fill="#6d28d9" font-family="Inter,sans-serif" font-size="12">RECUERDA: el modal voltea de lado. El verbo queda en base.</text>
</svg>
