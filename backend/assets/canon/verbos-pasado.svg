  <text x="380" y="72" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">PRESENTE (He/She/It)</text>
  <text x="560" y="72" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">PASADO (todos)</text>

  <g font-family="Inter,Segoe UI,sans-serif" font-size="11">
