    <text x="560" y="407" text-anchor="middle" fill="#059669" font-weight="700">said</text>

    <rect x="16" y="414" width="688" height="22" fill="#f8f5ff"/>
    <text x="70" y="429" text-anchor="middle" fill="#D97706" font-weight="700">send</text>
    <text x="200" y="429" text-anchor="middle" fill="#312e81">mandar</text>
