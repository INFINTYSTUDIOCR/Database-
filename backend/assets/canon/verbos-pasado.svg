  <text x="360" y="488" text-anchor="middle" fill="#5B21B6" font-size="12" font-weight="600">Alivio: en pasado nadie cambia · I/He/She/It ’ WAS · You/We/They ’ WERE</text>
  <text x="360" y="508" text-anchor="middle" fill="#7c3aed" font-size="11">*put / cut / let  iguales · el ancla (yesterday / last / ago) dice el tiempo</text>
  <text x="360" y="526" text-anchor="middle" fill="#6d28d9" font-size="10">Conecta M1 pronombres + M2 presente ’ conversación básica real</text>
</svg>
