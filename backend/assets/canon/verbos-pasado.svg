    <text x="560" y="429" text-anchor="middle" fill="#059669" font-weight="700">sent</text>

    <rect x="16" y="436" width="688" height="22" fill="#ede9fe"/>
    <text x="70" y="451" text-anchor="middle" fill="#D97706" font-weight="700">seem</text>
    <text x="200" y="451" text-anchor="middle" fill="#312e81">parecer</text>
    <text x="380" y="451" text-anchor="middle" fill="#0284c7" font-weight="700">seems</text>
    <text x="560" y="451" text-anchor="middle" fill="#059669" font-weight="700">seemed</text>
