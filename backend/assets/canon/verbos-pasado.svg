<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Modulo 3  16 verbos presente vs pasado">
  <rect width="720" height="540" rx="14" fill="#f8f5ff"/>
  <text x="360" y="24" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">MODULO 3  PASADO SIMPLE · 16 VERBOS</text>
  <text x="360" y="42" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="11">En pasado nadie cambia · excepción BE: was / were · ancla = yesterday / last / ago</text>

  <rect x="16" y="54" width="688" height="26" rx="6" fill="#5B21B6"/>
  <text x="70" y="72" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">VERBO</text>
