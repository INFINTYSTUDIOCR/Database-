<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinity Holdings — glosario de nesting</title>
  <link rel="stylesheet" href="../../css/infinity-training-glossary.css?v=20260825gloss" />
  <style>
    :root {
      --blue: #3178C6;
      --blue-deep: #1e5a9a;
      --blue-border: #B7D4EE;
      --text: #1a2b3c;
      --muted: #5b6f82;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(49,120,198,0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(49,120,198,0.12), transparent 50%),
        linear-gradient(180deg, #EAF3FB 0%, #F7FBFE 48%, #EEF5FB 100%);
      min-height: 100%;
    }
    .tb-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 14px 12px 28px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tb-top-brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue-deep);
    }
    .tb-top a {
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-deep);
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      background: rgba(255,255,255,0.7);
    }
    .tb-top a.primary {
      background: var(--blue);
      color: #fff;
      border-color: transparent;
    }
    .tb-card {
      background: #fff;
      border: 1.5px solid var(--blue-border);
      border-radius: 20px;
      padding: 18px 16px 16px;
      box-shadow: 0 10px 30px rgba(30, 90, 154, 0.08);
      flex: 1;
    }
    .tb-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 4px;
    }
    .tb-icon {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #E8F2FB;
      color: var(--blue);
      display: grid;
      place-items: center;
    }
    .tb-icon svg { width: 20px; height: 20px; }
    .tb-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--blue-deep);
      line-height: 1.25;
    }
    .tb-sub {
      margin: 4px 0 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    /* Page already has brand lead — hide library duplicate */
    #glossary-root .inf-tb-lead,
    #glossary-root .kh-lib-lead { display: none; }
    #glossary-root.inf-tb-shell {
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 0;
    }
    #glossary-root .inf-tb-grid { max-height: min(48vh, 360px); }
    @media (min-width: 520px) {
      .tb-card { padding: 22px 22px 18px; }
      .tb-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="tb-shell">
    <div class="tb-top">
      <div class="tb-top-brand">∞ Infinity Holdings · Training Book</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="primary" href="../mac/machote-curso.pdf" target="_blank" rel="noopener">PDF del curso</a>
        <a href="../mac/machote-curso.pdf" download>Descargar PDF</a>
      </div>
    </div>

    <section class="tb-card" aria-label="Glosario de nesting">
      <div class="tb-head">
        <div class="tb-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div>
          <h1 class="tb-title">Infinity Holdings — glosario de nesting</h1>
          <p class="tb-sub">Buscá Encabezado, AMR, however o PIN. Cada chip es un ejemplo para el desk de Infinity Holdings (queue, Emails/Compose/Send, notes, Resolve).</p>
        </div>
      </div>
      <div id="glossary-root"></div>
    </section>
  </div>

  <script src="../../js/infinity-recursos-library.js?v=20260825gloss"></script>
  <script>
    (function () {
      var root = document.getElementById('glossary-root');
      var lib = window.InfinityRecursosLibrary || window.KamukRecursosLibrary;
      if (root && lib && typeof lib.mountGlossary === 'function') {
        lib.mountGlossary(root, { brand: 'infinity', hideLead: true });
      } else if (root) {
        root.innerHTML = '<p class="inf-tb-empty">No se pudo cargar el glosario. Recargá la página.</p>';
      }
    })();
  </script>
</body>
</html>
